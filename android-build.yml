name: Final Samosa King APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: FORCE ENABLE ANDROIDX
        shell: bash
        run: |
          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            > "$GITHUB_WORKSPACE/gradle.properties"
      - name: Verify AndroidX
        shell: bash
        run: |
          grep -q '^android.useAndroidX=true$' "$GITHUB_WORKSPACE/gradle.properties"
          grep -q '^android.enableJetifier=true$' "$GITHUB_WORKSPACE/gradle.properties"
      - name: Apply Captain Live patch
        shell: bash
        run: |
          python3 tools/patch_captain_live.py
          grep -q 'CAPTAIN_LIVE_NATIVE_V1' app/src/main/java/com/samosaking/nawalgarh/MainActivity.java
          grep -q 'captain-live.js' app/src/main/assets/index.html
          echo "CAPTAIN LIVE PATCH APPLIED"
      - name: Build Final APK (category photo fix)
        shell: bash
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-Final-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error