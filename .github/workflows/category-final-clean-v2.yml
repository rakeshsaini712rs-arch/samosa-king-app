name: Category Final Clean V2
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/category_final_clean_v2.py'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final category cleanup
        run: python3 tools/category_final_clean_v2.py
      - name: Commit fixed app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          git diff --cached --quiet || git commit -m 'Final clean category labels and order'
          git push
