name: Samosa King FINAL APK v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: FORCE ANDROIDX
        shell: bash
        run: |
          echo "android.useAndroidX=true" >> "$GITHUB_WORKSPACE/gradle.properties"
          echo "android.enableJetifier=true" >> "$GITHUB_WORKSPACE/gradle.properties"
          echo "===== GRADLE PROPERTIES ====="
          cat "$GITHUB_WORKSPACE/gradle.properties"
          echo "=============================="

      - name: Verify AndroidX
        shell: bash
        run: |
          grep "android.useAndroidX=true" "$GITHUB_WORKSPACE/gradle.properties"
          grep "android.enableJetifier=true" "$GITHUB_WORKSPACE/gradle.properties"

      - name: Build APK
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-Final-APK-v2
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
