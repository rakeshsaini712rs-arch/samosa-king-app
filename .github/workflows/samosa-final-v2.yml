name: Samosa King FINAL APK v3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract FINAL project
        shell: bash
        run: |
          set -e
          rm -rf _final_build
          mkdir -p _final_build
          unzip -q SamosaKing_FINAL_READY_REUPLOAD.zip -d _final_build

          test -f _final_build/settings.gradle
          test -f _final_build/build.gradle
          test -f _final_build/app/build.gradle
          test -f _final_build/app/google-services.json
          test -f _final_build/app/src/main/AndroidManifest.xml
          test -f _final_build/app/src/main/java/com/samosaking/nawalgarh/MainActivity.java

          echo "FINAL PROJECT FOUND"
          find _final_build -maxdepth 4 -type f | sort

      - name: Enable AndroidX
        working-directory: _final_build
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Build FINAL APK
        working-directory: _final_build
        run: |
          gradle clean assembleDebug --no-daemon --stacktrace \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true

      - name: Verify APK
        shell: bash
        run: |
          test -s _final_build/app/build/outputs/apk/debug/app-debug.apk
          ls -lh _final_build/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-FINAL-v3
          path: _final_build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
