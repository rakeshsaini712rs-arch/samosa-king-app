name: Final Samosa King UI cleanup

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
      GRADLE_USER_HOME: ${{ runner.temp }}/samosa-gradle-home
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply FINAL category-photo fix
        run: python tools/fix_category_photos_final.py

      - name: Verify category-photo source
        shell: bash
        run: |
          set -e
          grep -F 'SK_CATEGORY_PHOTOS_FINAL_SINGLE_SOURCE_20261002_V2' app/src/main/assets/index.html
          test "$(grep -o 'skCategoryPhotoFinalScript' app/src/main/assets/index.html | wc -l)" -eq 1
          test "$(grep -o 'skFinalCatPhoto' app/src/main/assets/index.html | wc -l)" -ge 3
          echo 'Category photo source verified: one implementation, permanent local images.'

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html tools/fix_category_photos_final.py
          if git diff --cached --quiet; then
            echo 'No source changes.'
          else
            git commit -m 'Fix category photos permanently and remove duplicates'
            git push
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build CUSTOMER APK
        run: gradle clean :app:assembleDebug --no-daemon --no-parallel --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Verify CUSTOMER APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload CUSTOMER APK
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-CUSTOMER-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
