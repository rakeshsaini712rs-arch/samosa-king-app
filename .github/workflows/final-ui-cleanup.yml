name: Final Samosa King UI cleanup

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean duplicate UI text in source
        shell: python {0}
        run: |
          from pathlib import Path
          import re

          files = list(Path('.').rglob('*.java')) + list(Path('.').rglob('*.kt'))
          changed = []

          labels = ['20–30 min', '20-30 min', 'Near & Fast', 'Fresh & Hot', 'Fast Delivery']

          for p in files:
              try:
                  s = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              original = s

              # Remove the obsolete OTP prompt from the customer UI.
              s = s.replace('Send OTP', '')
              s = s.replace('+91XXXXXXXXXX', '')

              # Collapse immediately repeated delivery labels, including
              # HTML/whitespace/bullet separators between the copies.
              for label in labels:
                  esc = re.escape(label)
                  pat = re.compile(
                      rf'({esc})(?:(?:\\n|\\r|\\t|&nbsp;|[•·|]|<[^>]*>|\\s){{0,160}})({esc})',
                      re.IGNORECASE
                  )
                  s = pat.sub(r'\1', s)

              if s != original:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))

          print('Changed:', changed)

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Fix duplicate delivery UI and remove OTP prompt'
          git push
