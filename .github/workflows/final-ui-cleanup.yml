name: Final Samosa King UI cleanup

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
      GRADLE_USER_HOME: ${{ runner.temp }}/samosa-gradle-home
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean duplicate customer UI in actual HTML source
        shell: python {0}
        run: |
          from pathlib import Path
          import re

          files = list(Path('.').rglob('*.html')) + list(Path('.').rglob('*.java')) + list(Path('.').rglob('*.kt'))
          changed = []

          for p in files:
              try:
                  s = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              original = s

              if p.name == 'index.html':
                  s = re.sub(
                      r'function skProductTicker\(\)\{return .*?\}\s*\nfunction card\(',
                      "function skProductTicker(){return '<div class=\\\"skProductTicker\\\"><div class=\\\"skTickerTrack\\\"><span class=\\\"skTickerItem\\\">⏱ 20–30 min</span><span class=\\\"skTickerDot\\\">•</span><span class=\\\"skTickerItem\\\">⚡ Near & Fast</span><span class=\\\"skTickerDot\\\">•</span><span class=\\\"skTickerItem\\\">🔥 Fresh & Hot</span><span class=\\\"skTickerDot\\\">•</span><span class=\\\"skTickerItem\\\">🚴 Fast Delivery</span></div></div>'}\nfunction card(",
                      s,
                      count=1,
                      flags=re.S
                  )

                  labels = ['20–30 min', '20-30 min', 'Near & Fast', 'Fresh & Hot', 'Fast Delivery']
                  for label in labels:
                      esc = re.escape(label)
                      pat = re.compile(rf'({esc})(?:(?:\\n|\\r|\\t|&nbsp;|[•·|]|<[^>]*>|\\s){{0,160}})({esc})', re.IGNORECASE)
                      s = pat.sub(r'\1', s)

                  s = s.replace('Send OTP', '')
                  s = s.replace('+91XXXXXXXXXX', '')
                  s = s.replace('₹30 up to 5 km', '₹30')
                  s = s.replace('Delivery ₹30 up to 5 km', 'Delivery ₹30')
              else:
                  s = s.replace('Send OTP', '')
                  s = s.replace('+91XXXXXXXXXX', '')

              if s != original:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))

          print('Changed:', changed)

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Fix duplicate customer delivery UI'
            git push
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build CUSTOMER APK
        run: gradle clean :app:assembleDebug --no-daemon --no-parallel --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Verify CUSTOMER APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload CUSTOMER APK
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-CUSTOMER-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
