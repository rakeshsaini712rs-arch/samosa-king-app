name: Apply real local category photos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
      GRADLE_USER_HOME: ${{ runner.temp }}/samosa-gradle-home
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch customer category photos
        run: python3 tools/patch_customer_category_photos_real.py

      - name: Commit patched customer source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/index.html
          if git diff --cached --quiet; then
            echo "Category photo source already patched."
          else
            git commit -m "Fix category photos with bundled local images"
            git push
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build CUSTOMER APK
        run: gradle clean :app:assembleDebug --no-daemon --no-parallel --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Verify CUSTOMER APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload CUSTOMER APK
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-CUSTOMER-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
