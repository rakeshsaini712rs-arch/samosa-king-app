name: Build Live Tracking APKs
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/patch_captain_live.py
      - run: python3 tools/fix_customer_ui_duplicates.py
      - run: python3 tools/fix_checkout_phone.py
      - name: Persist final customer info/help removal
        run: python3 tools/final_customer_info_cleanup.py
      - name: Remove App 57 duplicate customer UI
        run: python3 tools/remove_app57_duplicate_ui.py
      - name: Remove empty latest-order box when there is no active order
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')
          css_id = 'skEmptyOrderBoxFixStyle'
          if css_id not in s:
              css = '''<style id="skEmptyOrderBoxFixStyle">.track.skNoActiveOrder{background:transparent!important;border-color:transparent!important;box-shadow:none!important;padding:0!important}</style>'''
              if '</head>' not in s: raise SystemExit('Could not find </head> in customer index.html')
              s = s.replace('</head>', css + '</head>', 1)
          js_id = 'skEmptyOrderBoxFixScript'
          if js_id not in s:
              js = '''<script id="skEmptyOrderBoxFixScript">(function(){function sync(){var st=document.getElementById('status');if(!st)return;var box=st.closest('.track');if(!box)return;var empty=(st.textContent||'').replace(/\\s+/g,' ').trim()==='No active order';box.classList.toggle('skNoActiveOrder',empty)}function start(){sync();var st=document.getElementById('status');if(st)new MutationObserver(sync).observe(st,{childList:true,subtree:true,characterData:true})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start()})();</script>'''
              if '</body>' not in s: raise SystemExit('Could not find </body> in customer index.html')
              s = s.replace('</body>', js + '</body>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify Captain Live patch
        shell: bash
        run: |
          set -e
          grep -F 'captain-live-native.js' app/src/main/assets/index.html || true
          grep -F 'captain-live.js' app/src/main/assets/index.html
          grep -F 'CAPTAIN_LIVE_NATIVE_V2' app/src/main/java/com/samosaking/nawalgarh/MainActivity.java
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle clean :app:assembleDebug :delivery:assembleDebug --no-daemon --no-parallel --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true
      - run: test -s app/build/outputs/apk/debug/app-debug.apk && test -s delivery/build/outputs/apk/debug/delivery-debug.apk
      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo 'FIREBASE_SERVICE_ACCOUNT secret is not configured; APK build will still complete.'; exit 0; fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-service-account.json
          npm install -g firebase-tools >/dev/null 2>&1
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json firebase deploy --only firestore:rules --project samosa-king-3b90d
      - uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-CUSTOMER-LIVE-TRACKING
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-DELIVERY-LIVE-TRACKING
          path: delivery/build/outputs/apk/debug/delivery-debug.apk
