name: Build Live Tracking APKs
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/patch_customer_delivery_tracking.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle clean :app:assembleDebug :delivery:assembleDebug --no-daemon --no-parallel --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true
      - run: test -s app/build/outputs/apk/debug/app-debug.apk && test -s delivery/build/outputs/apk/debug/delivery-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-CUSTOMER-LIVE-TRACKING
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-DELIVERY-LIVE-TRACKING
          path: delivery/build/outputs/apk/debug/delivery-debug.apk
