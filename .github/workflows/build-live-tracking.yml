name: Build Live Tracking APKs
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/patch_customer_delivery_tracking.py
      - run: python3 tools/fix_customer_ui_duplicates.py
      - name: Persist final customer info/help removal
        run: python3 tools/final_customer_info_cleanup.py
      - name: Remove App 57 duplicate customer UI
        run: python3 tools/remove_app57_duplicate_ui.py
      - name: Verify final customer UI cleanup
        shell: bash
        run: |
          set -e
          grep -F '__SK_FINAL_CUSTOMER_INFO_CLEANUP__' app/src/main/assets/settings-fix.js
          grep -F '__SK_APP57_DUPLICATE_UI_FIX__' app/src/main/assets/settings-fix.js
          if grep -F 'onclick="selectCategory(\'all\')">🍽️ All</button><button class="cat"' app/src/main/assets/index.html; then
            echo 'ERROR: old static duplicate category buttons remain'
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle clean :app:assembleDebug :delivery:assembleDebug --no-daemon --no-parallel --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true
      - run: test -s app/build/outputs/apk/debug/app-debug.apk && test -s delivery/build/outputs/apk/debug/delivery-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-CUSTOMER-LIVE-TRACKING
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-DELIVERY-LIVE-TRACKING
          path: delivery/build/outputs/apk/debug/delivery-debug.apk
