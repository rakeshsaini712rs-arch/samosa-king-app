name: Definitive customer footer fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-and-build:
    if: github.event.head_commit.message != 'Definitive customer footer cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove unwanted customer Help Center block
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('MainActivity.java')
          s=p.read_text()
          start='<div class=\\\"helpbox\\\" id=\\\"helpSection\\\">'
          end='</div><div class=\\\"choiceModal\\\" id=\\\"restaurantModal\\\">'
          a=s.find(start)
          b=s.find(end, a) if a >= 0 else -1
          if a >= 0 and b >= 0:
              s=s[:a]+end[5:]
          else:
              import re
              s=re.sub(r'<div class=\\\"helpbox\\\" id=\\\"helpSection\\\">.*?</div></div>(?=<div class=\\\"choiceModal\\\")','',s,count=1,flags=re.S)
          s=s.replace('/* DEFINITIVE_CUSTOMER_FOOTER_FIX_V2 */ #helpSection{display:block!important}','')
          s=s.replace('/* DEFINITIVE_CUSTOMER_FOOTER_FIX_V2 */ #helpSection{display:none!important}','')
          p.write_text(s)
          PY
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MainActivity.java
          git diff --cached --quiet || git commit -m 'Definitive customer footer cleanup'
          git push
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build customer APK
        run: chmod +x gradlew && ./gradlew clean :app:assembleDebug
      - name: Upload customer APK
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-CUSTOMER-FOOTER-FIX
          path: app/build/outputs/apk/debug/*.apk
