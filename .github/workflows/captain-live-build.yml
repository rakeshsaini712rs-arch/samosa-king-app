name: Captain Live Customer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
      GRADLE_USER_HOME: ${{ runner.temp }}/samosa-gradle-home
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply secure Captain Live native bridge
        run: python3 tools/patch_captain_live.py
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build customer APK
        run: gradle clean :app:assembleDebug --no-daemon --no-parallel --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo 'FIREBASE_SERVICE_ACCOUNT secret is not configured; APK build will still complete.'; exit 0; fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-service-account.json
          npm install -g firebase-tools >/dev/null 2>&1
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json firebase deploy --only firestore:rules --project samosa-king-3b90d
      - name: Upload customer APK
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-Captain-Live-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
