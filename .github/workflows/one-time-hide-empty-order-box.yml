name: One-time hide empty order box
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-hide-empty-order-box.yml'
  workflow_dispatch:

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Hide empty latest-order box
        shell: python
        run: |
          from pathlib import Path
          p = Path('MainActivity.java')
          s = p.read_text(encoding='utf-8')
          old = r'<div class=\"track\"><div class=\"status\" id=\"status\">'
          new = r'<div class=\"track\" id=\"orderTrackBox\" style=\"display:none\"><div class=\"status\" id=\"status\">'
          if old not in s:
              raise SystemExit('Expected track markup not found; stopping without changing source.')
          s = s.replace(old, new, 1)
          marker = r'</body>'
          js = r'''<script>(function(){function sync(){var st=document.getElementById('status'),box=document.getElementById('orderTrackBox');if(!st||!box)return;var empty=(st.textContent||'').trim()==='No active order';box.style.display=empty?'none':'';}document.addEventListener('DOMContentLoaded',function(){sync();var st=document.getElementById('status');if(st)new MutationObserver(sync).observe(st,{childList:true,subtree:true,characterData:true});});})();</script>'''
          if marker not in s:
              raise SystemExit('HTML closing marker not found; stopping without changing source.')
          s = s.replace(marker, js + marker, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit source change and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainActivity.java
          git commit -m "Hide empty latest order box when no active order"
          git rm .github/workflows/one-time-hide-empty-order-box.yml
          git commit -m "Remove one-time cleanup workflow"
          git push
