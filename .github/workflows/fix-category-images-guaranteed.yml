name: Fix Category Images Guaranteed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Guaranteed category image fallback') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic embedded category photos
        shell: bash
        run: |
          python3 tools/fix_category_bar_final.py
          grep -q 'CATEGORY_PHOTO_EMBEDDED_FINAL_V1' app/src/main/assets/index.html
          echo 'CATEGORY PHOTO EMBEDDED FIX APPLIED'
      - name: Commit fallback
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/index.html
          git diff --cached --quiet || git commit -m 'Guaranteed category image fallback'
          git push
