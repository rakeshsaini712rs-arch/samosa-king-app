name: OTP-fixed Workflow 420 Build
on:
  push:
    branches:
      - otp-fix-420
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: |
          cat app/src/main/assets/otp-ui-fix.js >> app/src/main/assets/settings-fix.js
      - run: gradle clean :app:assembleDebug --no-daemon --no-parallel --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true
      - run: gradle :admin:assembleDebug --no-daemon --no-parallel --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true
      - run: gradle :delivery:assembleDebug --no-daemon --no-parallel --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true
      - run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s admin/build/outputs/apk/debug/admin-debug.apk
          test -s delivery/build/outputs/apk/debug/delivery-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-CUSTOMER-APK-OTP-FIX-420
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-ADMIN-APK-OTP-FIX-420
          path: admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-DELIVERY-APK-OTP-FIX-420
          path: delivery/build/outputs/apk/debug/delivery-debug.apk
          if-no-files-found: error
