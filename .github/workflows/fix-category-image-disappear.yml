name: Fix category image persistence permanently

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

auto_cancel: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch category image persistence in WebView source
        shell: python
        run: |
          from pathlib import Path
          p = Path('MainActivity.java')
          s = p.read_text(encoding='utf-8')
          marker = 'CATEGORY_IMAGE_PERMANENT_FIX_20261001'
          if marker in s:
              print('Permanent category image fix already present.')
              raise SystemExit(0)

          # Add a WebView-side guard that remembers every real image URL and
          # immediately restores it if category navigation/rerendering blanks it.
          needle = 'new WebViewClient() {'
          if needle not in s:
              raise SystemExit('WebViewClient block not found')

          injection = r'''new WebViewClient() {
      // CATEGORY_IMAGE_PERMANENT_FIX_20261001
      @Override public void onPageFinished(WebView view, String url) {
        super.onPageFinished(view, url);
        view.evaluateJavascript("""
          (function(){
            if(window.__SK_CATEGORY_IMAGE_PERMANENT_FIX__) return;
            window.__SK_CATEGORY_IMAGE_PERMANENT_FIX__=true;
            var saved=new WeakMap();
            function remember(img){
              if(!img) return;
              var src=img.getAttribute('src') || img.src || '';
              if(src && src!=='about:blank') saved.set(img,src);
              var old=saved.get(img);
              if(old && (!img.getAttribute('src') || img.getAttribute('src')==='about:blank')) img.setAttribute('src',old);
              img.loading='eager';
              img.decoding='sync';
              img.style.setProperty('visibility','visible','important');
              img.style.setProperty('opacity','1','important');
            }
            function fixAll(){ document.querySelectorAll('img').forEach(remember); }
            fixAll();
            [50,150,300,600,1000,1800].forEach(function(ms){setTimeout(fixAll,ms);});
            var mo=new MutationObserver(function(records){
              records.forEach(function(r){
                if(r.type==='attributes' && r.target && r.target.tagName==='IMG') remember(r.target);
                if(r.type==='childList') r.addedNodes.forEach(function(n){
                  if(n.nodeType===1){
                    if(n.tagName==='IMG') remember(n);
                    if(n.querySelectorAll) n.querySelectorAll('img').forEach(remember);
                  }
                });
              });
            });
            mo.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['src','style','class','loading']});

            // Category buttons may rerender/replace their section. After every
            // category tap, keep the selected section rendered and its photos visible.
            document.addEventListener('click',function(e){
              var cat=e.target.closest && e.target.closest('.cat');
              if(!cat) return;
              setTimeout(fixAll,0);
              setTimeout(fixAll,100);
              setTimeout(fixAll,350);
              setTimeout(fixAll,800);
            },true);
          })();
        """, null);
      }
'''
          s = s.replace(needle, injection, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainActivity.java
          if git diff --cached --quiet; then
            echo "No source changes."
            exit 0
          fi
          git commit -m "Permanently keep category product images visible"
          git push
