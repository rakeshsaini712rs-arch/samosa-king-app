name: Customer-only duplicate cleanup

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/assets/duplicate-cleanup.js'
      - '.github/workflows/customer-only-duplicate-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[skip duplicate cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject customer-only cleanup into index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="duplicate-cleanup.js?v=1"></script>'
          if tag not in s:
              marker = '</body>'
              if marker in s:
                  s = s.replace(marker, tag + marker, 1)
              else:
                  s += tag
              p.write_text(s, encoding='utf-8')

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/index.html app/src/main/assets/duplicate-cleanup.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix customer app duplicate UI [skip duplicate cleanup]"
          git push
