name: One-time customer footer cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message != 'Remove duplicate customer footer/help blocks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only unwanted customer footer/help UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('MainActivity.java')
          s=p.read_text()
          marker='CUSTOMER_FOOTER_CLEANUP_V1'
          if marker in s:
              print('Already patched')
              raise SystemExit(0)
          inject=r'''<script>/* CUSTOMER_FOOTER_CLEANUP_V1 */
          (function(){
            function clean(){
              const needles=[
                'Delivery ₹30 up to 5 km','PaymentCash on Delivery','Open8:30 AM–6:00 PM','Help7891851475',
                '☎ Help Center','Order/help: 7891851475','Call💬 WhatsApp',
                '📍 Nansa Gate, Nawalgarh  •  🚚 Delivery ₹30  •  ₹100 minimum  •  💵 COD'
              ];
              document.querySelectorAll('body *').forEach(function(el){
                if(el.children.length===0){
                  const t=(el.textContent||'').replace(/\\s+/g,' ').trim();
                  if(needles.some(function(n){return t===n || t.includes(n)})){
                    const box=el.closest('.helpbox') || el.parentElement;
                    if(box && box.id==='helpSection') box.remove();
                    else if(box && !box.id && box.children.length<=4) box.remove();
                    else el.remove();
                  }
                }
              });
              document.querySelectorAll('.helpbox').forEach(function(el){
                const t=(el.textContent||'').replace(/\\s+/g,' ').trim();
                if(t.includes('Order/help: 7891851475') || t.includes('Delivery ₹30 up to 5 km')) el.remove();
              });
            }
            new MutationObserver(clean).observe(document.documentElement,{childList:true,subtree:true});
            window.addEventListener('load',clean); setTimeout(clean,200); setTimeout(clean,1000);
          })();</script>'''
          target='</body>'
          if target not in s:
              raise SystemExit('No </body> marker found')
          s=s.replace(target, inject+target, 1)
          p.write_text(s)
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MainActivity.java
          git diff --cached --quiet && exit 0
          git commit -m 'Remove duplicate customer footer/help blocks'
          git push
