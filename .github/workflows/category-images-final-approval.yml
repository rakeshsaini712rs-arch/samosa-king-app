name: Samosa King Category Images FINAL APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
      GRADLE_USER_HOME: ${{ runner.temp }}/samosa-gradle-home
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply existing category renderers in safe order
        run: |
          python3 tools/fix_category_photos_final.py
          python3 tools/fix_category_bar_final.py
          grep -q 'CATEGORY_PHOTO_EMBEDDED_FINAL_V1' app/src/main/assets/index.html
          echo 'CATEGORY PHOTO EMBEDDED FINAL PRESENT'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build CUSTOMER APK
        run: gradle clean assembleDebug --no-daemon --no-parallel --stacktrace

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload required final artifact
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
