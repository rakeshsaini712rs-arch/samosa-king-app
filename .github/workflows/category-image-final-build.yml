name: Samosa King - FINAL Category Images APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply single canonical category fix
        run: python tools/final_customer_category_audit_fix.py

      - name: Hard remove duplicate category renderers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          # Keep exactly one category container. Remove every additional static #cats/.cats block.
          pat=re.compile(r'<div\b[^>]*(?:id=["\']cats["\']|class=["\'][^"\']*\bcats\b[^"\']*["\'])[^>]*>.*?</div>',re.I|re.S)
          blocks=list(pat.finditer(s))
          if len(blocks)>1:
              keep=blocks[0]
              out=[]; last=0
              for i,b in enumerate(blocks):
                  if i==0: continue
                  out.append(s[last:b.start()]); last=b.end()
              out.append(s[last:]); s=''.join(out)
          # Ensure each category card contains only one image and one label; preserve the first image.
          def clean_card(m):
              b=m.group(0)
              imgs=re.findall(r'<img\b[^>]*>',b,re.I)
              label=re.search(r'<span\b[^>]*>\s*([^<]+?)\s*</span>',b,re.I|re.S)
              if not imgs: return b
              src=re.search(r'\bsrc=["\']([^"\']+)',imgs[0],re.I)
              alt=re.search(r'\balt=["\']([^"\']*)',imgs[0],re.I)
              text=(label.group(1).strip() if label else (alt.group(1).strip() if alt else ''))
              return '<button class="cat" type="button" data-category="'+re.sub(r'[^a-z0-9]+','-',text.lower()).strip('-')+'"><img src="'+(src.group(1) if src else '')+'" alt="'+text+'"><span>'+text+'</span></button>'
          s=re.sub(r'<button\b[^>]*class=["\'][^"\']*\bcat\b[^"\']*["\'][^>]*>.*?</button>',clean_card,s,flags=re.I|re.S)
          # Remove duplicate category CSS/JS patches left in the source; canonical controller remains.
          for ident in ['categoryFinalCleanV2Css','categoryFinalCleanV2Script','skCategoryPhotoFinalStyle','skCategoryPhotoFinalScript','skRealCategoryPhotoStyle','skRealCategoryPhotoScript']:
              s=re.sub(r'<(?:style|script)\b[^>]*\bid=["\']'+re.escape(ident)+r'["\'][^>]*>.*?</(?:style|script)>','',s,flags=re.I|re.S)
          p.write_text(s,encoding='utf-8')
          print('CATEGORY_OVERLAP_HARD_FIX_APPLIED')
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build customer APK
        run: gradle :app:assembleDebug --no-daemon --no-parallel --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload final customer APK
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-CATEGORY-OVERLAP-HARD-FIX-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
