name: Patch final build category step

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old category-photo build patch
        shell: python3 {0}
        run: |
          from pathlib import Path
          p=Path('.github/workflows/FINAL_BUILD_APK.yml')
          s=p.read_text(encoding='utf-8')
          start=s.find('      - name: Remove duplicate/overlapping category photos')
          end=s.find('      - name: Definitive customer ticker cleanup', start)
          if start < 0 or end < 0:
              print('Category step already replaced or markers not found.')
          else:
              replacement='''      - name: Apply definitive category-photo fix\n        run: python3 tools/fix_category_photos_final.py\n\n      - name: Verify definitive category-photo source\n        run: |\n          set -e\n          grep -F 'SK_CATEGORY_PHOTOS_FINAL_SINGLE_SOURCE_20261002_V3' app/src/main/assets/index.html\n          test "$(grep -o 'id=\\"skCategoryPhotoFinalScript\\"' app/src/main/assets/index.html | wc -l)" -eq 1\n          test "$(grep -o 'skFinalCatPhoto' app/src/main/assets/index.html | wc -l)" -ge 3\n          grep -F 'window.SK_IMAGES' app/src/main/assets/index.html\n\n'''
              s=s[:start]+replacement+s[end:]
              p.write_text(s,encoding='utf-8')
              print('FINAL_BUILD_APK.yml category-photo step replaced.')
      - name: Commit workflow patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/FINAL_BUILD_APK.yml
          if git diff --cached --quiet; then echo 'No patch needed.'; else git commit -m 'Use definitive category photo fix in final APK workflow' && git push; fi
