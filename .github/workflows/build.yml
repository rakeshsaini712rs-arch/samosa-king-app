name: Build Samosa King APKs

on:
  workflow_dispatch:
  push:
    branches: [main]:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build customer and admin APKs
        run: gradle clean :app:assembleDebug :admin:assembleDebug --no-daemon --no-parallel --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Verify customer APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify admin APK
        run: test -s admin/build/outputs/apk/debug/admin-debug.apk

      - name: Upload customer APK
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-CUSTOMER-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-ADMIN-APK
          path: admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
