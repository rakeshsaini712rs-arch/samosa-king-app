name: Build Samosa King APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build CUSTOMER APK
        run: gradle clean :app:assembleDebug --no-daemon --no-parallel --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Verify CUSTOMER APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Build ADMIN APK
        run: gradle :admin:assembleDebug --no-daemon --no-parallel --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Verify ADMIN APK
        run: test -s admin/build/outputs/apk/debug/admin-debug.apk

      - name: Upload CUSTOMER APK
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-CUSTOMER-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload ADMIN APK
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-ADMIN-APK
          path: admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
