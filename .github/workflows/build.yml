name: Samosa King APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build premium pizza video
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 --retry-delay 2             -o app/src/main/assets/product-video-source.mp4             "https://videos.pexels.com/video-files/31528548/13438748_1920_1080_25fps.mp4"
          ffmpeg -y -loglevel error -stream_loop -1 -i app/src/main/assets/product-video-source.mp4             -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30,drawbox=x=0:y=0:w=iw:h=150:color=black@0.30:t=fill,drawtext=text='SAMOSA KING':fontcolor=white:fontsize=58:font='DejaVu Sans':x=70:y=55,drawtext=text='Fresh • Hot • Delicious':fontcolor=white:fontsize=30:font='DejaVu Sans':x=70:y=120"             -t 15 -an -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p             -movflags +faststart app/src/main/assets/product-video.mp4
          rm -f app/src/main/assets/product-video-source.mp4
          test -s app/src/main/assets/product-video.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,duration             -of csv=p=0 app/src/main/assets/product-video.mp4

      - name: Build customer APK
        run: gradle clean :app:assembleDebug --no-daemon --no-parallel --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Build admin APK
        run: gradle :admin:assembleDebug --no-daemon --no-parallel --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Verify APKs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s admin/build/outputs/apk/debug/admin-debug.apk

      - name: Upload customer APK
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-CUSTOMER-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-ADMIN-APK
          path: admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
