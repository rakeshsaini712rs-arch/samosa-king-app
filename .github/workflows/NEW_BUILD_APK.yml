name: Samosa King NEW APK BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
      GRADLE_USER_HOME: ${{ runner.temp }}/samosa-gradle-home

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Apply definitive customer UI cleanup
        shell: bash
        run: |
          set -e
          python3 tools/fix_customer_ui_duplicates.py
          test -f app/src/main/assets/index.html
          if grep -F '⏱ 20–30 min</span><span class="skTickerDot">•</span><span class="skTickerItem">⚡ Near & Fast</span><span class="skTickerDot">•</span><span class="skTickerItem">🔥 Fresh & Hot</span><span class="skTickerDot">•</span><span class="skTickerItem">🚴 Fast Delivery</span><span class="skTickerDot">•</span><span class="skTickerItem">⏱ 20–30 min' app/src/main/assets/index.html; then
            echo 'ERROR: duplicated delivery ticker is still present'
            exit 1
          fi
          if grep -F '+91XXXXXXXXXX' app/src/main/assets/index.html; then
            echo 'ERROR: obsolete OTP phone placeholder is still present'
            exit 1
          fi
          if grep -F 'Send OTP' app/src/main/assets/index.html; then
            echo 'ERROR: obsolete Send OTP UI is still present'
            exit 1
          fi
          echo 'Customer UI cleanup verified.'

      - name: Fix duplicate customer delivery strip
        shell: bash
        run: |
          set -e
          FIX="app/src/main/assets/settings-fix.js"
          test -f "$FIX"
          cat >> "$FIX" <<'EOF'

/* Build-time duplicate delivery-strip hardening. */
(function(){
  if(window.__skDeliveryStripHardening)return;
  window.__skDeliveryStripHardening=true;
  var phrase=/20[–-]30 min\s*[•·]\s*⚡\s*Near & Fast\s*[•·]\s*🔥\s*Fresh & Hot\s*[•·]\s*🚴\s*Fast Delivery/g;
  function clean(){
    document.querySelectorAll('.card').forEach(function(card){
      var seen=0;
      card.querySelectorAll('*').forEach(function(el){
        if(!el.children.length)return;
        var text=(el.textContent||'').replace(/\s+/g,' ').trim();
        var matches=text.match(phrase);
        if(!matches)return;
        seen++;
        if(seen>1){el.style.setProperty('display','none','important');return;}
        if(matches.length>1){
          var parts=text.split(phrase);
          var keep=parts.shift().trim();
          el.textContent=(keep?keep+' ':'')+matches[0];
        }
      });
    });
  }
  function run(){clean();setTimeout(clean,250);setTimeout(clean,800);setTimeout(clean,1800);setTimeout(clean,3500);}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
  new MutationObserver(function(){
    if(window.__skDeliveryStripHardeningBusy)return;
    window.__skDeliveryStripHardeningBusy=true;
    setTimeout(function(){window.__skDeliveryStripHardeningBusy=false;clean()},120);
  }).observe(document.documentElement,{childList:true,subtree:true});
})();
EOF
          echo "Duplicate delivery-strip hardening applied."

      - name: Keep mobile number only inside Buy Now checkout
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</body>'
          if marker not in s:
              raise SystemExit('ERROR: index.html closing body tag not found')
          script = r'''<script>
          (function(){
            if(window.__skCheckoutPhoneFix)return;
            window.__skCheckoutPhoneFix=true;
            function cleanMainPhoneFields(){
              document.querySelectorAll('input#phone,input[name="phone"],input[data-field="phone"]').forEach(function(el){
                var modal=document.getElementById('modal');
                if(modal && modal.contains(el)) return;
                var wrap=el.closest('label,.field,.inputGroup,.formGroup');
                if(wrap && wrap.querySelectorAll('input').length===1) wrap.remove();
                else el.remove();
              });
            }
            function ensureCheckoutPhone(){
              cleanMainPhoneFields();
              var modal=document.getElementById('modal');
              if(!modal || !modal.querySelector('.sheet')) return;
              var sheet=modal.querySelector('.sheet');
              var phone=sheet.querySelector('#phone');
              if(!phone){
                var name=sheet.querySelector('#name');
                phone=document.createElement('input');
                phone.id='phone';
                phone.type='tel';
                phone.inputMode='numeric';
                phone.autocomplete='tel';
                phone.maxLength=10;
                phone.className='input';
                phone.placeholder='Mobile number (10 digits)';
                phone.setAttribute('aria-label','Mobile number');
                if(name && name.parentNode) name.parentNode.insertBefore(phone,name.nextSibling);
                else sheet.insertBefore(phone,sheet.firstChild);
              }
              phone.addEventListener('input',function(){this.value=this.value.replace(/\D/g,'').slice(0,10);},{once:false});
            }
            function run(){cleanMainPhoneFields();ensureCheckoutPhone();}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
            document.addEventListener('click',function(e){
              var t=e.target;
              if(t && (t.closest('#modal .order') || t.closest('.cartbtn') || t.closest('.buyNow'))) setTimeout(ensureCheckoutPhone,60);
            },true);
            new MutationObserver(function(){
              if(window.__skCheckoutPhoneBusy)return;
              window.__skCheckoutPhoneBusy=true;
              setTimeout(function(){window.__skCheckoutPhoneBusy=false;run();},80);
            }).observe(document.documentElement,{childList:true,subtree:true});
          })();
          </script>\n'''
          s = s.replace(marker, script + marker, 1)
          p.write_text(s, encoding='utf-8')
          print('Checkout-only mobile number fix injected.')
          PY
          grep -F 'Mobile number (10 digits)' app/src/main/assets/index.html
          echo 'Verified: mobile field is injected only into #modal checkout at runtime.'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build customer APK
        run: gradle :app:assembleDebug --no-daemon --no-parallel --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Build admin APK
        run: gradle :admin:assembleDebug --no-daemon --no-parallel --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Verify APK files
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s admin/build/outputs/apk/debug/admin-debug.apk

      - name: Upload customer APK
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-CUSTOMER-APK-NEW
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-KING-ADMIN-APK-NEW
          path: admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
