name: Deploy Firestore Rules

on:
  workflow_dispatch:
  push:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/FIRESTORE_RULES_TRIGGER.txt'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Verify Firebase configuration
        run: |
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS)); console.log('Service account:', x.client_email); console.log('Project:', x.project_id);"
          firebase --version

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project samosa-king-3b90d --non-interactive --debug