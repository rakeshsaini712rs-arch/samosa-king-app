name: Samosa King FINAL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
      GRADLE_USER_HOME: ${{ runner.temp }}/samosa-gradle-home
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply definitive customer UI duplicate fix
        run: python3 tools/fix_customer_ui_duplicates.py

      - name: Verify customer UI fix
        shell: bash
        run: |
          set -e
          test -f app/src/main/assets/index.html
          if grep -F '⏱ 20–30 min</span><span class="skTickerDot">•</span><span class="skTickerItem">⚡ Near & Fast</span><span class="skTickerDot">•</span><span class="skTickerItem">🔥 Fresh & Hot</span><span class="skTickerDot">•</span><span class="skTickerItem">🚴 Fast Delivery</span><span class="skTickerDot">•</span><span class="skTickerItem">⏱ 20–30 min' app/src/main/assets/index.html; then
            echo 'ERROR: duplicated delivery ticker remains'
            exit 1
          fi
          if grep -F '+91XXXXXXXXXX' app/src/main/assets/index.html; then
            echo 'ERROR: obsolete OTP placeholder remains'
            exit 1
          fi
          if grep -F 'Send OTP' app/src/main/assets/index.html; then
            echo 'ERROR: obsolete Send OTP UI remains'
            exit 1
          fi
          echo 'Customer UI duplicate/OTP cleanup verified.'

      - name: Apply Admin payment verification patch
        run: python3 tools/patch_admin_payment.py

      - name: Apply Delivery payment instruction patch
        run: python3 tools/patch_delivery_payment.py

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build customer APK
        run: gradle clean :app:assembleDebug --no-daemon --no-parallel --stacktrace --refresh-dependencies -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Build admin APK
        run: gradle :admin:assembleDebug --no-daemon --no-parallel --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Build delivery APK
        run: gradle :delivery:assembleDebug --no-daemon --no-parallel --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Verify APKs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s admin/build/outputs/apk/debug/admin-debug.apk
          test -s delivery/build/outputs/apk/debug/delivery-debug.apk

      - name: Upload customer APK
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-CUSTOMER-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-ADMIN-APK
          path: admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error

      - name: Upload delivery APK
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-DELIVERY-APK
          path: delivery/build/outputs/apk/debug/delivery-debug.apk
          if-no-files-found: error
