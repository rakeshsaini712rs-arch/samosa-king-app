name: Samosa King FINAL APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build product video
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/assets/video-segments
          rm -f app/src/main/assets/video-segments/*.mp4
          images=(
            app/src/main/assets/product-images/pizza.jpg
            app/src/main/assets/product-images/burger.jpg
            app/src/main/assets/product-images/samosa.jpg
            app/src/main/assets/product-images/mirchi-bada.jpg
            app/src/main/assets/product-images/momos.jpg
            app/src/main/assets/product-images/pasta.jpg
            app/src/main/assets/product-images/manchurian.jpg
          )
          i=0
          for img in "${images[@]}"; do
            test -s "$img"
            ffmpeg -y -loglevel error -loop 1 -i "$img" -t 2.4 -vf "scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,zoompan=z='min(zoom+0.0018,1.08)':d=72:s=1280x720:fps=30" -c:v libx264 -pix_fmt yuv420p -an "app/src/main/assets/video-segments/seg-$i.mp4"
            i=$((i+1))
          done
          printf "file 'seg-%s.mp4'\n" 0 1 2 3 4 5 6 > app/src/main/assets/video-segments/list.txt
          ffmpeg -y -loglevel error -f concat -safe 0 -i app/src/main/assets/video-segments/list.txt -c copy -movflags +faststart app/src/main/assets/product-video.mp4
          test -s app/src/main/assets/product-video.mp4
          rm -rf app/src/main/assets/video-segments

      - name: Build customer APK
        run: gradle clean :app:assembleDebug --no-daemon --no-parallel --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Build admin APK
        run: gradle :admin:assembleDebug --no-daemon --no-parallel --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Verify APKs
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s admin/build/outputs/apk/debug/admin-debug.apk

      - name: Upload customer APK
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-CUSTOMER-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-ADMIN-APK
          path: admin/build/outputs/apk/debug/admin-debug.apk
          if-no-files-found: error
