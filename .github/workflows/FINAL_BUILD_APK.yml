name: Samosa King CUSTOMER APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-customer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
      GRADLE_USER_HOME: ${{ runner.temp }}/samosa-gradle-home
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove customer service information block
        run: python3 tools/remove_customer_info_block.py

      - name: Apply customer duplicate cleanup
        run: python3 tools/fix_customer_ui_duplicates.py

      - name: Apply checkout-only mobile number fix
        run: python3 tools/fix_checkout_phone.py

      - name: CLEAN category renderer - keep native renderCats only
        shell: python3 {0}
        run: |
          from pathlib import Path
          import re
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          ids=[
            'skRealCategoryPhotoStyle','skRealCategoryPhotoScript',
            'skCategoryPhotoDedupV2','skCategoryPhotoDedupV2Script',
            'skCategoryPhotoMatchV3','skCategoryPhotoMatchV3Script',
            'skCategoryPhotoMatchV4','skCategoryPhotoMatchV4Script',
            'skCategoryPhotoFinalStyle','skCategoryPhotoFinalScript',
            'skCategoryPhotoGuaranteedStyle','skCategoryPhotoGuaranteedScript',
            'customerCategoryPhotoDedupStyle','customerCategoryPhotoDedupScript'
          ]
          for ident in ids:
              s=re.sub(r'<style id="'+re.escape(ident)+r'">.*?</style>','',s,flags=re.S)
              s=re.sub(r'<script id="'+re.escape(ident)+r'">.*?</script>','',s,flags=re.S)
          s=re.sub(r'<style id="skCategoryPhoto[^>]*">.*?</style>','',s,flags=re.S)
          s=re.sub(r'<script id="skCategoryPhoto[^>]*">.*?</script>','',s,flags=re.S)
          p.write_text(s,encoding='utf-8')

      - name: Verify native category renderer
        shell: bash
        run: |
          set -e
          test -s app/src/main/assets/index.html
          if grep -E 'skCategoryPhoto|skRealCategoryPhoto|skGuaranteedPhoto|skFinalCatPhoto|customerCategoryPhoto' app/src/main/assets/index.html; then
            echo 'ERROR: experimental category patch remains'
            exit 1
          fi
          grep -F 'function renderCats()' app/src/main/assets/index.html
          grep -F 'catImgs=' app/src/main/assets/index.html
          grep -F 'catImg' app/src/main/assets/index.html
          grep -F 'catName' app/src/main/assets/index.html
          echo 'Native category renderer verified: one image + one label per category.'

      - name: Verify customer cleanup
        shell: bash
        run: |
          set -e
          if grep -F '+91XXXXXXXXXX' app/src/main/assets/index.html; then exit 1; fi
          if grep -F 'Send OTP' app/src/main/assets/index.html; then exit 1; fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build CUSTOMER APK only
        run: gradle clean :app:assembleDebug --no-daemon --no-parallel --stacktrace --refresh-dependencies -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Verify CUSTOMER APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload CUSTOMER APK only
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-CUSTOMER-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
