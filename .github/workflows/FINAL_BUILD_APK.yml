name: Samosa King CUSTOMER APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-customer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
      GRADLE_USER_HOME: ${{ runner.temp }}/samosa-gradle-home
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove customer service information block
        run: python3 tools/remove_customer_info_block.py

      - name: Apply customer duplicate cleanup
        run: python3 tools/fix_customer_ui_duplicates.py

      - name: Apply checkout-only mobile number fix
        run: python3 tools/fix_checkout_phone.py

      - name: Remove duplicate/overlapping category photos
        shell: python3 {0}
        run: |
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* __CUSTOMER_CATEGORY_PHOTO_DEDUP_V1__ */'
          if marker not in s:
              js=r'''<style id="customerCategoryPhotoDedupStyle">
/* __CUSTOMER_CATEGORY_PHOTO_DEDUP_V1__ */
#cats .cat::before,#cats .cat::after{content:none!important;display:none!important;background:none!important}
#cats .cat{background-image:none!important}
#cats .cat>img,#cats .cat>picture,#cats .cat>.catPhoto,#cats .cat>.categoryImage,#cats .cat>.category-img,#cats .cat>.cat-image{display:none!important}
#cats .cat .skCatPhoto{z-index:3!important}
</style>
<script id="customerCategoryPhotoDedupScript">
(function(){
  if(window.__customerCategoryPhotoDedupV1)return;
  window.__customerCategoryPhotoDedupV1=true;
  var MAP={
    'All':'product-images/samosa.jpg',
    'Fast Food':'product-images/pizza.jpg',
    'Snacks':'product-images/samosa.jpg',
    'Chaat & Special':'product-images/dahi-bhalla-1.jpg',
    'Indian Thali':'product-images/manchurian.jpg',
    'Desi Rasoi':'product-images/manchurian.jpg',
    'Birthday Special':'product-images/gulab-jamun.jpg',
    'Beverages':'product-images/burger.jpg',
    'Sweets':'product-images/gulab-jamun.jpg',
    'Restaurant / Hotel':'product-images/pizza.jpg'
  };
  function text(el){return (el.textContent||'').replace(/\s+/g,' ').trim();}
  function fix(){
    var root=document.getElementById('cats');
    if(!root)return;
    root.querySelectorAll('.cat').forEach(function(cat){
      cat.style.setProperty('background-image','none','important');
      Array.from(cat.children).forEach(function(ch){
        if(ch.tagName==='IMG'||ch.tagName==='PICTURE'||(ch.querySelector&&ch.querySelector('img')&&!ch.classList.contains('skCatPhoto')))ch.style.setProperty('display','none','important');
      });
      var holders=Array.from(cat.querySelectorAll('.skCatPhoto'));
      holders.slice(1).forEach(function(h){h.remove();});
      var key=text(cat),src=MAP[key];
      if(!src)return;
      var holder=holders[0];
      if(!holder){
        holder=document.createElement('span');
        holder.className='skCatPhoto';
        holder.innerHTML='<img alt="'+key+' category" loading="eager" decoding="sync">';
        cat.insertBefore(holder,cat.firstChild);
      }
      var img=holder.querySelector('img');
      if(img){
        img.src=src;
        img.style.setProperty('display','block','important');
        img.style.setProperty('visibility','visible','important');
        img.style.setProperty('opacity','1','important');
      }
    });
  }
  function run(){fix();setTimeout(fix,50);setTimeout(fix,200);setTimeout(fix,500);setTimeout(fix,1000);setTimeout(fix,2000);}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
  document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('#cats .cat'))run();},true);
  new MutationObserver(function(){fix();}).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>'''
              s=s.replace('</head>',js+'\n</head>',1)
              p.write_text(s,encoding='utf-8')

      - name: Definitive customer ticker cleanup
        shell: python3 {0}
        run: |
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* __CUSTOMER_ONLY_DUPLICATE_FIX_V2__ */'
          if marker not in s:
              js=r'''<script>
/* __CUSTOMER_ONLY_DUPLICATE_FIX_V2__ */
(function(){
  if(window.__customerOnlyDuplicateFixV2)return;
  window.__customerOnlyDuplicateFixV2=true;
  function clean(){
    document.querySelectorAll('.card').forEach(function(card){
      var tickers=Array.from(card.querySelectorAll('.skProductTicker'));
      tickers.slice(1).forEach(function(x){x.remove();});
      var t=tickers[0];
      if(t){
        var track=t.querySelector('.skTickerTrack');
        if(track){
          Array.from(track.children).slice(7).forEach(function(x){x.remove();});
          track.style.animation='none';
          track.style.transform='none';
          track.style.width='100%';
          track.style.justifyContent='center';
          track.style.gap='7px';
        }
      }
    });
  }
  function run(){clean();setTimeout(clean,100);setTimeout(clean,500);setTimeout(clean,1500);setTimeout(clean,3000);}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
  new MutationObserver(function(){setTimeout(clean,30);}).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>'''
              s=s.replace('</body>',js+'\n</body>',1)
              p.write_text(s,encoding='utf-8')

      - name: Verify customer cleanup
        shell: bash
        run: |
          set -e
          test -s app/src/main/assets/index.html
          grep -F '__CUSTOMER_ONLY_DUPLICATE_FIX_V2__' app/src/main/assets/index.html
          grep -F '__CUSTOMER_CATEGORY_PHOTO_DEDUP_V1__' app/src/main/assets/index.html
          if grep -F '+91XXXXXXXXXX' app/src/main/assets/index.html; then exit 1; fi
          if grep -F 'Send OTP' app/src/main/assets/index.html; then exit 1; fi
          echo 'Customer-only cleanup verified.'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build CUSTOMER APK only
        run: gradle clean :app:assembleDebug --no-daemon --no-parallel --stacktrace --refresh-dependencies -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Verify CUSTOMER APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload CUSTOMER APK only
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-CUSTOMER-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
