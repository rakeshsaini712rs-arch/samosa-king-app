name: Samosa King CUSTOMER APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-customer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
      GRADLE_USER_HOME: ${{ runner.temp }}/samosa-gradle-home
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove customer service information block
        run: python3 tools/remove_customer_info_block.py

      - name: Apply customer duplicate cleanup
        run: python3 tools/fix_customer_ui_duplicates.py

      - name: Apply checkout-only mobile number fix
        run: python3 tools/fix_checkout_phone.py

      - name: CLEAN category renderer - remove broken experimental patches
        shell: python3 {0}
        run: |
          from pathlib import Path
          import re
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          ids=[
            'skRealCategoryPhotoStyle','skRealCategoryPhotoScript',
            'skCategoryPhotoDedupV2','skCategoryPhotoDedupV2Script',
            'skCategoryPhotoMatchV3','skCategoryPhotoMatchV3Script',
            'skCategoryPhotoMatchV4','skCategoryPhotoMatchV4Script',
            'skCategoryPhotoFinalStyle','skCategoryPhotoFinalScript',
            'skCategoryPhotoGuaranteedStyle','skCategoryPhotoGuaranteedScript',
            'customerCategoryPhotoDedupStyle','customerCategoryPhotoDedupScript',
            'skNativeCategoryPhotoFix20261003Style','skNativeCategoryPhotoFix20261003Script'
          ]
          for ident in ids:
              s=re.sub(r'<style id="'+re.escape(ident)+r'">.*?</style>','',s,flags=re.S)
              s=re.sub(r'<script id="'+re.escape(ident)+r'">.*?</script>','',s,flags=re.S)
          s=re.sub(r'<style id="skCategoryPhoto[^>]*">.*?</style>','',s,flags=re.S)
          s=re.sub(r'<script id="skCategoryPhoto[^>]*">.*?</script>','',s,flags=re.S)
          p.write_text(s,encoding='utf-8')

      - name: Install FINAL local category photo renderer
        shell: python3 {0}
        run: |
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          patch=r'''<style id="skNativeCategoryPhotoFix20261003Style">
          /* FINAL_LOCAL_CATEGORY_PHOTOS_20261003 */
          #cats .cat{position:relative!important;overflow:hidden!important;min-height:102px!important;height:auto!important;padding:0!important;display:flex!important;flex-direction:column!important;align-items:stretch!important;justify-content:flex-start!important;background:#fff!important;text-align:center!important}
          #cats .cat .skNativeCatPhoto{display:block!important;width:100%!important;height:70px!important;min-height:70px!important;flex:0 0 70px!important;overflow:hidden!important;border-radius:11px 11px 0 0!important;background:#f4e4c5!important}
          #cats .cat .skNativeCatPhoto img{display:block!important;width:100%!important;height:100%!important;object-fit:cover!important;visibility:visible!important;opacity:1!important}
          #cats .cat .skNativeCatLabel{display:block!important;padding:6px 3px 8px!important;font-size:11px!important;line-height:1.15!important;font-weight:900!important;color:inherit!important}
          </style>
          <script id="skNativeCategoryPhotoFix20261003Script">
          (function(){
            if(window.__SK_NATIVE_CATEGORY_PHOTOS_FINAL_20261003__)return;
            window.__SK_NATIVE_CATEGORY_PHOTOS_FINAL_20261003__=true;
            var MAP={
              'All':'product-images/samosa.jpg',
              'Fast Food':'product-images/pizza.jpg',
              'Snacks':'product-images/samosa.jpg',
              'Chaat & Special':'product-images/dahi-bhalla-1.jpg',
              'Indian Thali':'product-images/manchurian.jpg',
              'Desi Rasoi':'product-images/manchurian.jpg',
              'Birthday Special':'product-images/gulab-jamun.jpg',
              'Beverages':'product-images/burger.jpg',
              'Sweets':'product-images/gulab-jamun.jpg',
              'Restaurant / Hotel':'product-images/pizza.jpg'
            };
            function clean(v){return String(v||'').replace(/\\s+/g,' ').trim();}
            function findKey(cat){
              var t=clean(cat.getAttribute('data-label')||cat.textContent);
              if(MAP[t])return t;
              var compact=t.toLowerCase().replace(/\\s*category\\s*/g,' ').replace(/\\s+/g,' ').trim();
              for(var k in MAP){if(k.toLowerCase()===compact)return k;}
              return null;
            }
            function apply(){
              var root=document.getElementById('cats')||document.querySelector('.cats');
              if(!root)return;
              root.querySelectorAll('.cat').forEach(function(cat){
                var key=findKey(cat); if(!key)return;
                var holder=cat.querySelector('.skNativeCatPhoto');
                if(!holder){holder=document.createElement('span');holder.className='skNativeCatPhoto';cat.insertBefore(holder,cat.firstChild);}
                var img=holder.querySelector('img');
                if(!img){img=document.createElement('img');holder.appendChild(img);}
                img.src=MAP[key]; img.alt=key+' category'; img.loading='eager'; img.decoding='sync';
                img.onerror=function(){this.style.display='none';};
                var lab=cat.querySelector('.skNativeCatLabel');
                if(!lab){lab=document.createElement('span');lab.className='skNativeCatLabel';cat.appendChild(lab);}
                lab.textContent=key;
              });
            }
            function run(){apply();[100,300,700,1500,3000,6000].forEach(function(t){setTimeout(apply,t);});}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
            document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('#cats .cat'))setTimeout(apply,30);},true);
            new MutationObserver(function(){clearTimeout(window.__SK_NATIVE_CAT_TIMER__);window.__SK_NATIVE_CAT_TIMER__=setTimeout(apply,100);}).observe(document.documentElement,{childList:true,subtree:true});
          })();
          </script>'''
          s=s.replace('</head>',patch+'\n</head>',1)
          p.write_text(s,encoding='utf-8')

      - name: Verify FINAL category photo renderer
        shell: bash
        run: |
          set -e
          test -s app/src/main/assets/index.html
          grep -F 'skNativeCategoryPhotoFix20261003Style' app/src/main/assets/index.html
          grep -F 'product-images/pizza.jpg' app/src/main/assets/index.html
          grep -F 'product-images/samosa.jpg' app/src/main/assets/index.html
          grep -F 'function renderCats()' app/src/main/assets/index.html
          echo 'FINAL category renderer verified: local food photo + label for every category.'

      - name: Verify customer cleanup
        shell: bash
        run: |
          set -e
          if grep -F '+91XXXXXXXXXX' app/src/main/assets/index.html; then exit 1; fi
          if grep -F 'Send OTP' app/src/main/assets/index.html; then exit 1; fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build CUSTOMER APK only
        run: gradle clean :app:assembleDebug --no-daemon --no-parallel --stacktrace --refresh-dependencies -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Verify CUSTOMER APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload CUSTOMER APK only
        uses: actions/upload-artifact@v4
        with:
          name: Samosa-King-CUSTOMER-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
