plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.samosaking.nawalgarh'
    compileSdk 35
    defaultConfig {
        applicationId 'com.samosaking.nawalgarh'
        minSdk 23
        targetSdk 35
        versionCode 32
        versionName '3.2'
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.core:core:1.15.0'
}

tasks.register('patchProductImages') {
    doLast {
        def f=file('src/main/assets/index.html'); def s=f.getText('UTF-8')
        if(!s.contains('<script src="image-data.js"></script>')) s=s.replace('</head>','<script src="image-data.js"></script></head>')
        if(!s.contains('<script src="production.js"></script>')) s=s.replace('</body>','<script src="admin.js"></script><script src="production.js"></script><script src="drawer-fix.js"></script><script src="all-buttons-fix.js"></script></body>')
        else { if(!s.contains('<script src="drawer-fix.js"></script>')) s=s.replace('<script src="production.js"></script>','<script src="production.js"></script><script src="drawer-fix.js"></script>'); if(!s.contains('<script src="all-buttons-fix.js"></script>')) s=s.replace('<script src="drawer-fix.js"></script>','<script src="drawer-fix.js"></script><script src="all-buttons-fix.js"></script>') }
        def st=s.indexOf('function card(x){'); def en=s.indexOf('function add(id){',st)
        if(st>=0&&en>st){def nc='''function card(x){let id=x[0],p=x[3],q=cart[id]||0;let im={mirchi:'mirchi-bada',kajukatli:'kaju-katli',gulabjamun:'gulab-jamun',sohanpapdi:'sohan-papdi',milkcake:'milk-cake'};let key=im[id]||id;let src=(window.SK_IMAGES&&window.SK_IMAGES[key])?('data:image/jpeg;base64,'+window.SK_IMAGES[key]):'';return `<div class="card"><div class="visual">${src?`<img class="photo" src="${src}" alt="${x[1]}" loading="eager">`:x[4]}</div><h3>${x[1]}</h3><div class="desc">${x[2]}</div><div class="unit">${x[5]}</div><div class="bottom"><span class="price">₹${p}</span>${q?`<div class="qty"><button onclick="changeQty('${id}',-1)">−</button><b>${q}</b><button onclick="changeQty('${id}',1)">+</button></div>`:`<button class="add" onclick="add('${id}')">Add</button>`}</div></div>`}''';s=s.substring(0,st)+nc+s.substring(en)}
        if(!s.contains('.photo{')) s=s.replace('</style>','.photo{width:100%;height:112px;object-fit:cover;display:block;border-radius:13px}.visual{overflow:hidden}</style>')
        f.setText(s,'UTF-8')
    }
}

tasks.register('patchProductionNative') {
    doLast {
        def f=file('src/main/java/com/samosaking/nawalgarh/MainActivity.java'); def s=f.getText('UTF-8')
        def token='a=FirebaseAuth.getInstance();db=FirebaseFirestore.getInstance();'
        def tokenNew='a=FirebaseAuth.getInstance();db=FirebaseFirestore.getInstance();com.google.firebase.messaging.FirebaseMessaging.getInstance().getToken().addOnSuccessListener(t->{if(a.getCurrentUser()!=null)db.collection("users").document(a.getCurrentUser().getUid()).set(java.util.Collections.singletonMap("fcmToken",t),SetOptions.merge());});'
        if(s.contains(token) && !s.contains('getToken().addOnSuccessListener')) s=s.replace(token,tokenNew)
        def authOld='if(a.getCurrentUser()==null)a.signInAnonymously().addOnSuccessListener(x->js("window.authReady&&window.authReady();"));'
        def authNew='if(a.getCurrentUser()==null)a.signInAnonymously().addOnSuccessListener(x->js("window.authReady&&window.authReady();")).addOnFailureListener(e->js("window.authError&&window.authError("+JSONObject.quote(e.getMessage())+");"));else js("window.authReady&&window.authReady();");'
        if(s.contains(authOld)) s=s.replace(authOld,authNew)
        def hs=s.indexOf('void history(){'); def he=s.indexOf('void profile(){',hs)
        if(hs>=0&&he>hs){def nh='void history(){if(a.getCurrentUser()==null){a.signInAnonymously().addOnSuccessListener(x->history()).addOnFailureListener(e->js("window.renderHistoryError("+JSONObject.quote(e.getMessage())+");"));return;}db.collection("orders").whereEqualTo("userId",a.getCurrentUser().getUid()).get().addOnSuccessListener(s->{try{List<DocumentSnapshot>l=new ArrayList<>(s.getDocuments());l.sort((x,y)->{Date dx=x.getDate("createdAt"),dy=y.getDate("createdAt");if(dx==null&&dy==null)return 0;if(dx==null)return 1;if(dy==null)return -1;return dy.compareTo(dx);});JSONArray out=new JSONArray();for(DocumentSnapshot d:l.subList(0,Math.min(50,l.size()))){JSONObject o=new JSONObject();o.put("id",d.getId());o.put("total",d.getLong("total")!=null?d.getLong("total"):0);o.put("status",String.valueOf(d.get("status")));o.put("date",d.getDate("createdAt")!=null?d.getDate("createdAt").toString():"Recent");Map<String,Object>im=d.get("items",Map.class);JSONArray ia=new JSONArray();if(im!=null)for(Map.Entry<String,Object>q:im.entrySet()){JSONObject z=new JSONObject();z.put("id",q.getKey());z.put("qty",((Number)q.getValue()).intValue());ia.put(z);}o.put("itemsJson",ia.toString());js("window.renderHistory("+JSONObject.quote(out.toString())+");");}catch(Exception e){js("window.renderHistoryError("+JSONObject.quote(e.getMessage())+");");}}).addOnFailureListener(e->js("window.renderHistoryError("+JSONObject.quote(e.getMessage())+");"));}';s=s.substring(0,hs)+nh+s.substring(he)}
        f.setText(s,'UTF-8')
    }
}

tasks.register('patchRealOrderFlow') {
    doLast {
        def f=file('src/main/java/com/samosaking/nawalgarh/MainActivity.java'); def s=f.getText('UTF-8')
        def st=s.indexOf('void order(String n,String p,String ad,String items,int sub,String coupon){'); def en=s.indexOf('void listen(String id){',st)
        if(st<0||en<=st) throw new GradleException('Order flow methods not found')
        def block='''void order(String n,String p,String ad,String items,int sub,String coupon){if(busy)return;pn=n==null?"":n.trim();pp=p==null?"":p.trim();pa=ad==null?"":ad.trim();pi=items==null?"[]":items;ps=sub;pc=coupon==null?"":coupon.trim().toUpperCase(Locale.US);discount=0;if(ps<100){js("window.orderError('Minimum order is ₹100.');");return;}if(pn.isEmpty()||pp.isEmpty()||pa.isEmpty()){js("window.orderError('Please enter name, mobile and delivery address.');");return;}busy=true;js("window.orderStarted&&window.orderStarted();");if(a.getCurrentUser()==null){a.signInAnonymously().addOnSuccessListener(x->locate()).addOnFailureListener(e->{busy=false;js("window.orderError("+JSONObject.quote("Firebase sign-in failed: "+e.getMessage())+");");});}else locate();}
void locate(){if(!busy)return;if(Build.VERSION.SDK_INT>=23&&ActivityCompat.checkSelfPermission(this,Manifest.permission.ACCESS_FINE_LOCATION)!=PackageManager.PERMISSION_GRANTED&&ActivityCompat.checkSelfPermission(this,Manifest.permission.ACCESS_COARSE_LOCATION)!=PackageManager.PERMISSION_GRANTED){busy=false;requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION,Manifest.permission.ACCESS_COARSE_LOCATION},LOC);js("window.locationRequired&&window.locationRequired();");return;}LocationManager m=(LocationManager)getSystemService(LOCATION_SERVICE);if(m==null){busy=false;js("window.orderError('Location service is unavailable.');");return;}boolean gps=false,net=false;try{gps=m.isProviderEnabled(LocationManager.GPS_PROVIDER);net=m.isProviderEnabled(LocationManager.NETWORK_PROVIDER);}catch(Exception e){}Location l=null;try{if(gps)l=m.getLastKnownLocation(LocationManager.GPS_PROVIDER);if(l==null&&net)l=m.getLastKnownLocation(LocationManager.NETWORK_PROVIDER);}catch(Exception e){}if(l!=null){distance(l);return;}if(!gps&&!net){busy=false;js("window.orderError('Please turn on GPS/location and try again.');");return;}final boolean[] done={false};Handler h=new Handler(Looper.getMainLooper());Runnable timeout=()->{if(!done[0]&&busy){done[0]=true;busy=false;js("window.orderError('Could not get your location. Please turn on GPS and try again.');");}};h.postDelayed(timeout,12000);LocationListener ll=new LocationListener(){public void onLocationChanged(Location x){if(done[0])return;done[0]=true;h.removeCallbacks(timeout);distance(x);}public void onProviderEnabled(String p){}public void onProviderDisabled(String p){}};try{if(net)m.requestSingleUpdate(LocationManager.NETWORK_PROVIDER,ll,Looper.getMainLooper());else m.requestSingleUpdate(LocationManager.GPS_PROVIDER,ll,Looper.getMainLooper());}catch(Exception e){h.removeCallbacks(timeout);busy=false;js("window.orderError("+JSONObject.quote("Location error: "+e.getMessage())+");");}}
void distance(Location l){if(!busy)return;float[] d={0};Location.distanceBetween(l.getLatitude(),l.getLongitude(),LAT,LON,d);double km=d[0]/1000;js("window.locationResult&&window.locationResult("+JSONObject.quote(String.format(Locale.US,"%.2f",km))+" );");if(km>R){busy=false;pn=null;js("window.orderError('Delivery is available only within 5 km of Nansa Gate, Nawalgarh.');");return;}create();}
void create(){if(!busy||a.getCurrentUser()==null){busy=false;js("window.orderError('Firebase account is not ready. Please try again.');");return;}Runnable save=()->{try{JSONArray ar=new JSONArray(pi);Map<String,Object>im=new HashMap<>();for(int i=0;i<ar.length();i++){JSONObject z=ar.getJSONObject(i);String id=z.getString("id");int qty=z.getInt("qty");if(qty>0)im.put(id,qty);}if(im.isEmpty()){busy=false;js("window.orderError('Cart is empty.');");return;}Map<String,Object>o=new HashMap<>();o.put("userId",a.getCurrentUser().getUid());o.put("customerName",pn);o.put("mobile",pp);o.put("address",pa);o.put("paymentMethod","COD");o.put("subtotal",ps);o.put("deliveryFee",30);o.put("discount",discount);o.put("couponCode",pc);o.put("total",ps+30-discount);o.put("status","PLACED");o.put("createdAt",FieldValue.serverTimestamp());o.put("items",im);db.collection("orders").add(o).addOnSuccessListener(r->{getPreferences(0).edit().putString("lastOrderId",r.getId()).putString("lastOrderItems",pi).apply();listen(r.getId());busy=false;js("window.orderCreated("+JSONObject.quote(r.getId())+");");}).addOnFailureListener(e->{busy=false;js("window.orderError("+JSONObject.quote("Order save failed: "+e.getMessage())+");");});}catch(Exception e){busy=false;js("window.orderError("+JSONObject.quote("Order data error: "+e.getMessage())+");");}};if(pc.isEmpty()){save.run();return;}db.collection("coupons").document(pc).get().addOnSuccessListener(c->{if(!c.exists()||!Boolean.TRUE.equals(c.getBoolean("enabled"))){busy=false;js("window.orderError('Invalid or inactive coupon.');");return;}Long min=c.getLong("minOrder");if(min!=null&&ps<min){busy=false;js("window.orderError('Minimum order for this coupon is ₹"+min+".');");return;}String type=c.getString("type");Long val=c.getLong("value");long v=val==null?0:val;discount="PERCENT".equals(type)?Math.min((long)ps,((long)ps*v)/100):Math.min((long)ps,v);save.run();}).addOnFailureListener(e->{busy=false;js("window.orderError("+JSONObject.quote("Coupon validation failed: "+e.getMessage())+");");});}
'''
        s=s.substring(0,st)+block+s.substring(en)
        f.setText(s,'UTF-8')
    }
}

