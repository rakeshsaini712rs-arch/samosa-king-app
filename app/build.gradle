plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.samosaking.nawalgarh'
    compileSdk 35
    defaultConfig {
        applicationId 'com.samosaking.nawalgarh'
        minSdk 23
        targetSdk 35
        versionCode 23
        versionName '2.3'
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.core:core:1.15.0'
}

tasks.register('patchProductImages') {
    doLast {
        def f = file('src/main/assets/index.html')
        def s = f.getText('UTF-8')
        def patch = '''
<script>
function skPatchProductImages(){
  var m={'Samosa':'samosa.jpg','Kachori':'samosa.jpg','Mirchi Bada':'mirchi-bada.jpg','Dahi Bhalla Plate 1':'dahi-bhalla-1.jpg','Dahi Bhalla Plate 2':'dahi-bhalla-2.jpg','Pizza':'pizza.jpg','Wraps':'wraps.jpg','Momos':'momos.jpg','Burger':'burger.jpg','Pasta':'pasta.jpg','Manchurian':'manchurian.jpg','Kaju Katli':'kaju-katli.jpg','Rasgulla':'rasgulla.jpg','Rajbhog':'rasgulla.jpg','Gulab Jamun':'gulab-jamun.jpg','Sohan Papdi':'sohan-papdi.jpg','Milk Cake':'milk-cake.jpg','Kalakand':'kalakand.jpg','Dilkushal':'dilkushal.jpg','Peda':'milk-cake.jpg','Petha':'kalakand.jpg','Namkin':'sohan-papdi.jpg','Rasmalai':'dahi-bhalla-1.jpg','Dahi (Curd)':'dahi-bhalla-2.jpg'};
  document.querySelectorAll('.card').forEach(function(c){var h=c.querySelector('h3');if(!h)return;var f=m[h.textContent.trim()];if(!f)return;var v=c.querySelector('.visual');if(!v)return;var img=v.querySelector('img');if(!img){img=document.createElement('img');img.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:13px;display:block';img.loading='eager';v.innerHTML='';v.appendChild(img)}var src='product-images/'+f;if(img.getAttribute('src')!==src)img.src=src;});
}
document.addEventListener('DOMContentLoaded',function(){skPatchProductImages();new MutationObserver(skPatchProductImages).observe(document.body,{childList:true,subtree:true});setTimeout(skPatchProductImages,100);setTimeout(skPatchProductImages,500);setTimeout(skPatchProductImages,1500)});
</script>
<script src="admin.js"></script>
<script src="production.js"></script>
'''
        if (!s.contains('<script src="production.js"></script>')) {
            if (s.contains('</body>')) s=s.replace('</body>',patch+'</body>')
            else if (s.contains('</html>')) s=s.replace('</html>',patch+'</html>')
            else s+=patch
            f.setText(s,'UTF-8')
        }
    }
}

tasks.register('patchProductionNative') {
    doLast {
        def f=file('src/main/java/com/samosaking/nawalgarh/MainActivity.java')
        def s=f.getText('UTF-8')
        def marker='setContentView(w);if(Build.VERSION.SDK_INT>=33&&checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)!=PackageManager.PERMISSION_GRANTED)requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS},5201);a=FirebaseAuth.getInstance();'
        if(s.contains(marker) && !s.contains('POST_NOTIFICATIONS,Manifest.permission.POST_NOTIFICATIONS')){
            s=s.replace('setContentView(w);a=FirebaseAuth.getInstance();',marker)
        }
        s=s.replace('u.startsWith("tel:")||u.startsWith("https://wa.me/")||u.startsWith("whatsapp:")','u.startsWith("tel:")||u.startsWith("https://wa.me/")||u.startsWith("whatsapp:")||u.startsWith("https://www.google.com/maps/")')
        def token='a=FirebaseAuth.getInstance();db=FirebaseFirestore.getInstance();'
        def tokenNew='a=FirebaseAuth.getInstance();db=FirebaseFirestore.getInstance();com.google.firebase.messaging.FirebaseMessaging.getInstance().getToken().addOnSuccessListener(t->{if(a.getCurrentUser()!=null)db.collection("users").document(a.getCurrentUser().getUid()).set(java.util.Collections.singletonMap("fcmToken",t),SetOptions.merge());});'
        if(s.contains(token) && !s.contains('getToken().addOnSuccessListener')) s=s.replace(token,tokenNew)
        def authOld='if(a.getCurrentUser()==null)a.signInAnonymously().addOnSuccessListener(x->js("window.authReady&&window.authReady();"));'
        def authNew='if(a.getCurrentUser()==null)a.signInAnonymously().addOnSuccessListener(x->js("window.authReady&&window.authReady();")).addOnFailureListener(e->js("window.authError&&window.authError("+JSONObject.quote(e.getMessage())+");"));else js("window.authReady&&window.authReady();");'
        if(s.contains(authOld) && !s.contains('window.authError')) s=s.replace(authOld,authNew)
        f.setText(s,'UTF-8')
    }
}

tasks.register('disableLoginGateForBuild') {
    doLast {
        def f=file('src/main/assets/production.js')
        def s=f.getText('UTF-8')
        s=s.replace('P.loginGate();','')
        f.setText(s,'UTF-8')
    }
}

preBuild.dependsOn(patchProductImages,patchProductionNative,disableLoginGateForBuild)