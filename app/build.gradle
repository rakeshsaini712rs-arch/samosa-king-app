plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.samosaking.nawalgarh'
    compileSdk 35
    defaultConfig {
        applicationId 'com.samosaking.nawalgarh'
        minSdk 23
        targetSdk 35
        versionCode 37
        versionName '3.7'
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.core:core:1.15.0'
}

tasks.register('patchProductImages') {
    doLast {
        def f = file('src/main/assets/index.html')
        def s = f.getText('UTF-8')
        def scripts = '<script src="admin.js"></script><script src="production.js"></script><script src="drawer-fix.js"></script><script src="all-buttons-fix.js"></script><script src="navigation-fix.js"></script><script src="live-order-fix.js"></script><script src="order-fix.js"></script><script src="runtime-fix.js"></script>'
        if (!s.contains('<script src="admin.js"></script>')) {
            s = s.replace('</body>', scripts + '</body>')
        } else if (!s.contains('<script src="runtime-fix.js"></script>')) {
            s = s.replace('</body>', '<script src="order-fix.js"></script><script src="runtime-fix.js"></script></body>')
        }
        def css = '.photo{width:100%;height:112px;object-fit:cover;display:block;border-radius:13px;image-rendering:auto;-webkit-backface-visibility:hidden;backface-visibility:hidden;transform:translateZ(0)}.visual{overflow:hidden}'
        if (!s.contains('image-rendering:auto')) s = s.replace('</style>', css + '</style>')
        f.setText(s, 'UTF-8')
    }
}

tasks.register('disableLoginGateForBuild') {
    doLast {
        def f = file('src/main/assets/production.js')
        def s = f.getText('UTF-8')
        s = s.replace('P.loginGate();', '')
        f.setText(s, 'UTF-8')
    }
}

tasks.register('patchFirestoreCouponRule') { doLast {} }

preBuild.dependsOn(patchProductImages, patchFirestoreCouponRule, disableLoginGateForBuild)
