plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.samosaking.nawalgarh'
    compileSdk 35
    defaultConfig {
        applicationId 'com.samosaking.nawalgarh'
        minSdk 23
        targetSdk 35
        versionCode 25
        versionName '2.5'
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.core:core:1.15.0'
}

tasks.register('patchProductImages') {
    doLast {
        def f = file('src/main/assets/index.html')
        def s = f.getText('UTF-8')
        def patch = '''
<script>
function skPatchProductImages(){
  var m={'Samosa':'samosa.jpg','Kachori':'samosa.jpg','Mirchi Bada':'mirchi-bada.jpg','Dahi Bhalla Plate 1':'dahi-bhalla-1.jpg','Dahi Bhalla Plate 2':'dahi-bhalla-2.jpg','Pizza':'pizza.jpg','Wraps':'wraps.jpg','Momos':'momos.jpg','Burger':'burger.jpg','Pasta':'pasta.jpg','Manchurian':'manchurian.jpg','Kaju Katli':'kaju-katli.jpg','Rasgulla':'rasgulla.jpg','Rajbhog':'rasgulla.jpg','Gulab Jamun':'gulab-jamun.jpg','Sohan Papdi':'sohan-papdi.jpg','Milk Cake':'milk-cake.jpg','Kalakand':'kalakand.jpg','Dilkushal':'dilkushal.jpg','Peda':'milk-cake.jpg','Petha':'kalakand.jpg','Namkin':'sohan-papdi.jpg','Rasmalai':'dahi-bhalla-1.jpg','Dahi (Curd)':'dahi-bhalla-2.jpg'};
  document.querySelectorAll('.card').forEach(function(c){var h=c.querySelector('h3');if(!h)return;var f=m[h.textContent.trim()];if(!f)return;var v=c.querySelector('.visual');if(!v)return;var img=v.querySelector('img');if(!img){img=document.createElement('img');img.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:13px;display:block';img.loading='eager';v.innerHTML='';v.appendChild(img)}var src='product-images/'+f;if(img.getAttribute('src')!==src)img.src=src;});
}
document.addEventListener('DOMContentLoaded',function(){skPatchProductImages();new MutationObserver(skPatchProductImages).observe(document.body,{childList:true,subtree:true});setTimeout(skPatchProductImages,100);setTimeout(skPatchProductImages,500);setTimeout(skPatchProductImages,1500)});
</script>
<script src="admin.js"></script>
<script src="production.js"></script>
'''
        if (!s.contains('<script src="production.js"></script>')) {
            if (s.contains('</body>')) s=s.replace('</body>',patch+'</body>')
            else if (s.contains('</html>')) s=s.replace('</html>',patch+'</html>')
            else s+=patch
            f.setText(s,'UTF-8')
        }
    }
}

tasks.register('patchProductionNative') {
    doLast {
        def f=file('src/main/java/com/samosaking/nawalgarh/MainActivity.java')
        def s=f.getText('UTF-8')
        def marker='setContentView(w);if(Build.VERSION.SDK_INT>=33&&checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)!=PackageManager.PERMISSION_GRANTED)requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS},5201);a=FirebaseAuth.getInstance();'
        if(s.contains(marker) && !s.contains('POST_NOTIFICATIONS,Manifest.permission.POST_NOTIFICATIONS')){
            s=s.replace('setContentView(w);a=FirebaseAuth.getInstance();',marker)
        }
        s=s.replace('u.startsWith("tel:")||u.startsWith("https://wa.me/")||u.startsWith("whatsapp:")','u.startsWith("tel:")||u.startsWith("https://wa.me/")||u.startsWith("whatsapp:")||u.startsWith("https://www.google.com/maps/")')
        def token='a=FirebaseAuth.getInstance();db=FirebaseFirestore.getInstance();'
        def tokenNew='a=FirebaseAuth.getInstance();db=FirebaseFirestore.getInstance();com.google.firebase.messaging.FirebaseMessaging.getInstance().getToken().addOnSuccessListener(t->{if(a.getCurrentUser()!=null)db.collection("users").document(a.getCurrentUser().getUid()).set(java.util.Collections.singletonMap("fcmToken",t),SetOptions.merge());});'
        if(s.contains(token) && !s.contains('getToken().addOnSuccessListener')) s=s.replace(token,tokenNew)
        def authOld='if(a.getCurrentUser()==null)a.signInAnonymously().addOnSuccessListener(x->js("window.authReady&&window.authReady();"));'
        def authNew='if(a.getCurrentUser()==null)a.signInAnonymously().addOnSuccessListener(x->js("window.authReady&&window.authReady();")).addOnFailureListener(e->js("window.authError&&window.authError("+JSONObject.quote(e.getMessage())+");"));else js("window.authReady&&window.authReady();");'
        if(s.contains(authOld) && !s.contains('window.authError')) s=s.replace(authOld,authNew)
        def hs=s.indexOf('void history(){')
        def he=s.indexOf('void profile(){',hs)
        if(hs>=0&&he>hs){
            def nh='void history(){if(a.getCurrentUser()==null){a.signInAnonymously().addOnSuccessListener(x->history()).addOnFailureListener(e->js("window.renderHistoryError("+JSONObject.quote(e.getMessage())+");"));return;}db.collection("orders").whereEqualTo("userId",a.getCurrentUser().getUid()).get().addOnSuccessListener(s->{try{List<DocumentSnapshot>l=new ArrayList<>(s.getDocuments());l.sort((x,y)->{Date dx=x.getDate("createdAt"),dy=y.getDate("createdAt");if(dx==null&&dy==null)return 0;if(dx==null)return 1;if(dy==null)return -1;return dy.compareTo(dx);});JSONArray out=new JSONArray();for(DocumentSnapshot d:l.subList(0,Math.min(50,l.size()))){JSONObject o=new JSONObject();o.put("id",d.getId());o.put("total",d.getLong("total")!=null?d.getLong("total"):0);o.put("status",String.valueOf(d.get("status")));o.put("date",d.getDate("createdAt")!=null?d.getDate("createdAt").toString():"Recent");Map<String,Object>im=d.get("items",Map.class);JSONArray ia=new JSONArray();if(im!=null)for(Map.Entry<String,Object>q:im.entrySet()){JSONObject z=new JSONObject();z.put("id",q.getKey());z.put("qty",((Number)q.getValue()).intValue());ia.put(z);}o.put("itemsJson",ia.toString());out.put(o);}js("window.renderHistory("+JSONObject.quote(out.toString())+");");}catch(Exception e){js("window.renderHistoryError("+JSONObject.quote(e.getMessage())+");");}}).addOnFailureListener(e->js("window.renderHistoryError("+JSONObject.quote(e.getMessage())+");"));}'
            s=s.substring(0,hs)+nh+s.substring(he)
        }
        def couponOld='if(pc.isEmpty()){save.run();return;}db.collection("coupons").document(pc).get().addOnSuccessListener(c->{'
        def couponNew='if(pc.isEmpty()){save.run();return;}if(pc.equals("DIWALI")){discount=Math.min((long)ps,((long)ps*10)/100);save.run();return;}db.collection("coupons").document(pc).get().addOnSuccessListener(c->{'
        if(s.contains(couponOld)) s=s.replace(couponOld,couponNew)
        f.setText(s,'UTF-8')
    }
}

tasks.register('patchDiwaliAndOrderUI') {
    doLast {
        def f=file('src/main/assets/production.js')
        def s=f.getText('UTF-8')
        def add='''\n(function(){\n  function install(){\n    var sheet=document.querySelector('.sheet');\n    if(sheet&&!document.getElementById('skcouponOrder')){\n      var box=document.createElement('div');box.className='sksection skoffer';box.id='skcouponOrder';\n      box.innerHTML='<h3>🎁 Coupon</h3><div class="skrow"><input id="skorderCoupon" class="skinput" placeholder="Coupon code (e.g. DIWALI)"><button type="button" class="skbtn gold" onclick="SKOrderFix.applyCoupon()">Apply</button></div><div id="skorderCouponMsg" class="sksmall"></div>';\n      var h=sheet.querySelector('h3');if(h)h.after(box);else sheet.prepend(box);\n    }\n    var b=document.querySelector('.order');if(b){b.removeAttribute('onclick');b.onclick=function(){SKOrderFix.submit()}}\n  }\n  window.SKOrderFix={\n    applyCoupon:function(){var v=(document.getElementById('skorderCoupon')?.value||'').trim().toUpperCase();var m=document.getElementById('skorderCouponMsg');if(v==='DIWALI'){m.textContent='✅ DIWALI coupon: 10% discount will be applied on subtotal.';m.style.color='#15824a';}else if(v)m.textContent='Coupon will be validated securely when the order is submitted.';else m.textContent='Enter a coupon code.';},\n    submit:function(){\n      var n=(document.getElementById('name')?.value||'').trim(),p=(document.getElementById('phone')?.value||'').trim(),ad=(document.getElementById('address')?.value||'').trim();\n      var c=(typeof cart!=='undefined')?cart:{};var sub=typeof subtotal==='function'?subtotal():0;var code=(document.getElementById('skorderCoupon')?.value||'').trim().toUpperCase();\n      var msg=document.getElementById('msg');\n      if(!Object.keys(c).length){if(msg)msg.textContent='Cart is empty.';return;}\n      if(sub<100){if(msg)msg.textContent='Minimum order is ₹100.';return;}\n      if(!n||!p||!ad){if(msg)msg.textContent='Please enter name, phone and delivery address.';return;}\n      if(!window.AndroidBridge||typeof AndroidBridge.placeOrderWithCoupon!=='function'){if(msg)msg.textContent='Order service is not available in this APK.';return;}\n      if(msg)msg.textContent=code==='DIWALI'?'Applying DIWALI 10% discount and checking delivery area…':'Checking delivery area and placing COD order…';\n      var items=Object.entries(c).map(function(e){return {id:e[0],qty:Number(e[1])}});\n      try{AndroidBridge.placeOrderWithCoupon(n,p,ad,JSON.stringify(items),sub,code);}catch(e){if(msg)msg.textContent='Could not start order: '+e.message;}\n    }\n  };\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(install,300)});else setTimeout(install,300);\n  setTimeout(install,1200);\n})();\n'''
        if(!s.contains('var c=(typeof cart!==\'undefined\')?cart:{}')) s+=add
        f.setText(s,'UTF-8')
    }
}

tasks.register('patchFirestoreCouponRule') {
    doLast {
        def f=file('../firestore.rules')
        def s=f.getText('UTF-8')
        def old='return (request.resource.data.couponCode == \'\' && request.resource.data.discount == 0)\n        || (request.resource.data.couponCode != \'\''
        def neu='return (request.resource.data.couponCode == \'\' && request.resource.data.discount == 0)\n        || (request.resource.data.couponCode == \'DIWALI\' && request.resource.data.discount == request.resource.data.subtotal * 10 / 100)\n        || (request.resource.data.couponCode != \'\''
        if(s.contains(old) && !s.contains("couponCode == 'DIWALI'")) s=s.replace(old,neu)
        f.setText(s,'UTF-8')
    }
}

tasks.register('disableLoginGateForBuild') {
    doLast {
        def f=file('src/main/assets/production.js')
        def s=f.getText('UTF-8')
        s=s.replace('P.loginGate();','')
        f.setText(s,'UTF-8')
    }
}

preBuild.dependsOn(patchProductImages,patchProductionNative,patchDiwaliAndOrderUI,patchFirestoreCouponRule,disableLoginGateForBuild)
