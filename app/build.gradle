plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.samosaking.nawalgarh'
    compileSdk 35
    defaultConfig {
        applicationId 'com.samosaking.nawalgarh'
        minSdk 23
        targetSdk 35
        versionCode 14
        versionName '1.4'
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
}

tasks.register('patchProductImages') {
    doLast {
        def f = file('src/main/assets/index.html')
        def s = f.getText('UTF-8')
        if (!s.contains('function skPatchProductImages')) {
            def patch = '''
<script>
function skPatchProductImages(){
  var m={
    'Samosa':'samosa.jpg','Kachori':'samosa.jpg','Mirchi Bada':'mirchi-bada.jpg',
    'Dahi Bhalla Plate 1':'dahi-bhalla-1.jpg','Dahi Bhalla Plate 2':'dahi-bhalla-2.jpg',
    'Pizza':'pizza.jpg','Wraps':'wraps.jpg','Momos':'momos.jpg','Burger':'burger.jpg',
    'Pasta':'pasta.jpg','Manchurian':'manchurian.jpg','Kaju Katli':'kaju-katli.jpg',
    'Rasgulla':'rasgulla.jpg','Rajbhog':'rasgulla.jpg','Gulab Jamun':'gulab-jamun.jpg',
    'Sohan Papdi':'sohan-papdi.jpg','Milk Cake':'milk-cake.jpg','Kalakand':'kalakand.jpg',
    'Dilkushal':'dilkushal.jpg','Peda':'milk-cake.jpg','Petha':'kalakand.jpg',
    'Namkin':'sohan-papdi.jpg','Rasmalai':'dahi-bhalla-1.jpg','Dahi (Curd)':'dahi-bhalla-2.jpg'
  };
  document.querySelectorAll('.card').forEach(function(c){
    var h=c.querySelector('h3'); if(!h) return;
    var f=m[h.textContent.trim()]; if(!f) return;
    var v=c.querySelector('.visual'); if(!v) return;
    var img=v.querySelector('img');
    if(!img){ img=document.createElement('img'); img.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:13px;display:block'; img.loading='eager'; v.innerHTML=''; v.appendChild(img); }
    var src='product-images/'+f;
    if(img.getAttribute('src')!==src) img.src=src;
  });
}
document.addEventListener('DOMContentLoaded', function(){
  skPatchProductImages();
  new MutationObserver(skPatchProductImages).observe(document.body,{childList:true,subtree:true});
  setTimeout(skPatchProductImages,100);
  setTimeout(skPatchProductImages,500);
  setTimeout(skPatchProductImages,1500);
});
</script>
'''
            if (s.contains('</body>')) {
                s = s.replace('</body>', patch + '</body>')
            } else if (s.contains('</html>')) {
                s = s.replace('</html>', patch + '</html>')
            } else {
                s += patch
            }
            f.setText(s, 'UTF-8')
        }
    }
}

preBuild.dependsOn('patchProductImages')
