function menuResult(raw){try{var a=typeof raw==='string'?JSON.parse(raw):(raw||[]),h='',i,o;for(i=0;i<a.length;i++){o=a[i];h+='<div class="menuItem" data-menu-id="'+esc(o.id)+'"><div class="menuItemHead"><span class="menuItemName">'+esc(o.name||o.id)+'</span><span class="menuItemState '+(o.enabled?'on':'')+'">'+(o.enabled?'AVAILABLE':'SOLD OUT')+'</span></div><input class="input menuPrice" id="price_'+esc(o.id)+'" type="number" min="0" value="'+esc(o.price)+'" placeholder="Price"><div class="menuActions"><button class="btn goldbtn" onclick="savePrice(\''+esc(o.id)+'\')">SAVE</button><button class="btn" onclick="saveAvailability(\''+esc(o.id)+'\','+(!o.enabled)+')">'+(o.enabled?'SOLD OUT':'AVAILABLE')+'</button></div></div>'}var m=document.getElementById('menu');if(m)m.innerHTML=h||'<div class="muted">No menu items configured.</div>';filterMenu(document.getElementById('menuSearch')?document.getElementById('menuSearch').value:'')}catch(e){adminError('Menu display error: '+e.message)}}

function ordersResult(raw){try{var a=typeof raw==='string'?JSON.parse(raw):(raw||[]);currentOrders=a;a.sort(function(x,y){return Number(y.createdAtMs||Date.parse(y.date)||0)-Number(x.createdAtMs||Date.parse(x.date)||0)});var pending=0,i;for(i=0;i<a.length;i++)if(a[i].status!=='DELIVERED'&&a[i].status!=='CANCELLED'&&a[i].status!=='REJECTED')pending++;var p=document.getElementById('pending'),t=document.getElementById('total'),s=document.getElementById('sales'),todayEl=document.getElementById('today'),o=document.getElementById('orders');if(p)p.textContent=pending;if(t)t.textContent=a.length;var sales=0,today=0,now=new Date().toDateString();for(i=0;i<a.length;i++){if(a[i].status==='DELIVERED')sales+=Number(a[i].total||0);if(new Date(a[i].date).toDateString()===now&&a[i].status!=='CANCELLED'&&a[i].status!=='REJECTED')today+=Number(a[i].total||0)}if(s)s.textContent='₹'+sales;if(todayEl)todayEl.textContent='₹'+today;if(o)o.innerHTML=a.length?mapOrders(a):'<p class="muted">No orders yet.</p>'}catch(e){adminError('Order display error: '+e.message)}}

function actionUrl(action,id,value){return 'samosa://admin/'+encodeURIComponent(action)+'?id='+encodeURIComponent(id||'')+'&value='+encodeURIComponent(value||'')}
function orderHtml(o){var items='',i,arr=o.items||[];var nb=nearestBoy(o);for(i=0;i<arr.length;i++)items+='<div class="itemline"><span>🍽️ <b>'+esc(arr[i].name)+'</b></span><span class="itemqty">× '+esc(arr[i].qty)+'</span></div>';var statuses=['ACCEPTED','PREPARING','OUT_FOR_DELIVERY','DELIVERED','CANCELLED'];var buttons='',s;for(i=0;i<statuses.length;i++){s=statuses[i];buttons+='<a class="btn '+(String(o.status||'')===s?'status-current':'')+'" data-order-id="'+esc(o.id)+'" data-status="'+s+'" href="'+actionUrl('status',o.id,s)+'">'+(String(o.status||'')===s?'✓ ':'')+s.replace(/_/g,' ')+'</a>'}buttons+='<a class="btn" href="'+actionUrl('reject',o.id,'')+'">REJECT</a><a class="btn" style="background:#b3261e;color:#fff" href="'+actionUrl('delete',o.id,'')+'" onclick="return confirm(\'Delete this order permanently? This cannot be undone.\')">🗑 DELETE</a>';return '<div class="order"><div><b>Order #'+esc(o.id)+'</b> <span class="pill">'+esc(o.status||'PLACED')+'</span></div><p>👤 <b>'+esc(o.name)+'</b><br>📞 '+esc(o.mobile||'')+'</p><p>📍 <b>Delivery address</b><br>'+esc(o.address||'')+'</p><div class="items"><div class="itemhead">🛒 ORDER ITEMS</div>'+items+'</div><p>Subtotal ₹'+esc(o.subtotal)+' + Delivery ₹'+esc(o.delivery)+' − Discount ₹'+esc(o.discount)+'<br><b>💰 Total ₹'+esc(o.total)+'</b></p>'+paymentHtml(o)+'<div class="deliveryAssign"><select id="boy_'+esc(o.id)+'"><option value="">🚚 Select Delivery Boy</option><option value="Rakeshsaini1@gmail.com" '+(String(o.deliveryBoyEmail||'')==='Rakeshsaini1@gmail.com'?'selected':'')+'>Delivery Boy 1</option><option value="Rakeshsaini2@gmail.com" '+(String(o.deliveryBoyEmail||'')==='Rakeshsaini2@gmail.com'?'selected':'')+'>Delivery Boy 2</option><option value="Rakeshsaini3@gmail.com" '+(String(o.deliveryBoyEmail||'')==='Rakeshsaini3@gmail.com'?'selected':'')+'>Delivery Boy 3</option><option value="Rakeshsaini4@gmail.com" '+(String(o.deliveryBoyEmail||'')==='Rakeshsaini4@gmail.com'?'selected':'')+'>Delivery Boy 4</option><opti var currentOrders=[],currentDeliveryBoys=[],leafletMap=null,leafletMarkers={},adminMarker=null,adminLat=null,adminLon=null,routeLines={},accuracyCircles={};
function loadGoogleMap(){initLeafletMap()}
function initLeafletMap(){var el=document.getElementById('deliveryMap');if(!el)return;if(window.L){createLeafletMap();return}el.innerHTML='<div class="mapFallback"><div><b>Loading live map…</b><br><small>Using OpenStreetMap</small></div></div>';var css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(css);var s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=createLeafletMap;s.onerror=function(){el.innerHTML='<div class="mapFallback"><div><b>Map unavailable</b><br>Please check internet connection.</div></div>'};document.head.appendChild(s)}
function createLeafletMap(){var el=document.getElementById('deliveryMap');if(!el||!window.L)return;el.innerHTML='';leafletMap=L.map(el,{zoomControl:true,scrollWheelZoom:true,doubleClickZoom:true,touchZoom:true}).setView([27.84018,75.26941],18);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap contributors'}).addTo(leafletMap);renderDeliveryMarkers()}
function bikeIcon(){return L.divIcon({className:'',html:'<div class="riderMarker">🛵</div>',iconSize:[32,32],iconAnchor:[16,16]})}
function adminIcon(){return L.divIcon({className:'',html:'<div class="adminMarker">📍</div>',iconSize:[32,32],iconAnchor:[16,16]})}
function startAdminLocation(){nativeCall('startAdminLocation')}function adminNativeLocation(lat,lon,accuracy){adminLat=Number(lat);adminLon=Number(lon);window.adminAccuracy=Number(accuracy||0);updateAdminLocation()}
function updateAdminLocation(){if(leafletMap&&window.L){var pos=[adminLat,adminLon];if(!adminMarker){adminMarker=L.marker(pos,{icon:adminIcon(),zIndexOffset:1000}).addTo(leafletMap);adminMarker.bindTooltip('ADMIN',{permanent:true,direction:'top',className:'adminLabel',offset:[0,-13]})}else adminMarker.setLatLng(pos);adminMarker.bindPopup('<b>📍 ADMIN</b><br>'+adminLat.toFixed(5)+', '+adminLon.toFixed(5))}renderDeliveryMarkers();renderDistanceList()}
function renderDeliveryMarkers(){if(!leafletMap||!window.L)return;var bounds=[],i,b,pos,m,age,live,uid,dist;for(i=0;i<currentDeliveryBoys.length;i++){b=currentDeliveryBoys[i];if(!b||!Number(b.latitude)||!Number(b.longitude))continue;uid=String(b.uid||b.email);pos=[Number(b.latitude),Number(b.longitude)];bounds.push(pos);age=b.lastSeenMs?Date.now()-b.lastSeenMs:999999999;live=!!(b.online&&age<180000);m=leafletMarkers[uid];if(!m){m=L.marker(pos,{icon:bikeIcon(),zIndexOffset:500}).addTo(leafletMap);leafletMarkers[uid]=m}else m.setLatLng(pos);m.bindTooltip('🛵 '+shortEmail(b.email),{permanent:true,direction:'top',className:'riderLabel',offset:[0,-16]});dist=(adminLat!=null&&adminLon!=null)?distanceKm(adminLat,adminLon,Number(b.latitude),Number(b.longitude)):null;m.bindPopup('<div style="min-width:190px"><b>🛵 '+esc(shortEmail(b.email))+'</b><br>📍 '+Number(b.latitude).toFixed(6)+', '+Number(b.longitude).toFixed(6)+'<br>📏 Admin se '+(dist==null?'GPS not available':dist.toFixed(2)+' km')+'<br>🎯 Accuracy '+(Number(b.accuracy||0)>0?Number(b.accuracy).toFixed(0)+' m':'—')+'<br>'+(live?'🟢 LIVE':'🟠 Last seen')+'<br><button onclick="focusBoy(\''+esc(uid)+'\')" style="margin-top:6px;padding:7px 10px;border:0;border-radius:8px;background:#17100b;color:#fff;font-weight:700">ZOOM HERE</button></div>');m.off('click');m.on('click',(function(marker){return function(){leafletMap.setView(marker.getLatLng(),19,{animate:true});marker.openPopup()}})(m));if(b.accuracy&&Number(b.accuracy)>0){if(!accuracyCircles[uid])accuracyCircles[uid]=L.circle(pos,{radius:Number(b.accuracy),weight:1,fillOpacity:.08}).addTo(leafletMap);else accuracyCircles[uid].setLatLng(pos).setRadius(Number(b.accuracy));}if(adminLat!=null&&adminLon!=null){var line=[[adminLat,adminLon],pos];if(!routeLines[uid])routeLines[uid]=L.polyline(line,{weight:3,dashArray:'8 7'}).addTo(leafletMap);else routeLines[uid].setLatLngs(line);}}for(uid in leafletMarkers){var found=false;for(i=0;i<currentDeliveryBoys.length;i++)if(String(currentDeliveryBoys[i].uid||currentDeliveryBoys[i].email)===String(uid)){found=true;break}if(!found){leafletMap.removeLayer(leafletMarkers[uid]);delete leafletMarkers[uid];if(routeLines[uid]){leafletMap.removeLayer(routeLines[uid]);delete routeLines[uid]}if(accuracyCircles[uid]){leafletMap.removeLayer(accuracyCircles[uid]);delete accuracyCircles[uid]}}}if(adminLat!=null&&adminLon!=null)bounds.push([adminLat,adminLon]);if(bounds.length===1)leafletMap.setView(bounds[0],18);else if(bounds.length>1&&leafletMap.getZoom()<15)leafletMap.fitBounds(L.latLngBounds(bounds),{padding:[45,45],maxZoom:18});}
function deliveryBoysResult(raw){try{currentDeliveryBoys=typeof raw==='string'?JSON.parse(raw):(raw||[]);var el=document.getElementById('deliveryBoys');if(!el)return;if(!currentDeliveryBoys.length){el.textContent='No delivery partner location received yet.';renderDeliveryMarkers();renderDistanceList();return}var h='',i,b,age,d;for(i=0;i<currentDeliveryBoys.length;i++){b=currentDeliveryBoys[i];age=b.lastSeenMs?Math.max(0,Math.round((Date.now()-b.lastSeenMs)/60000)):9999;d=(adminLat!=null&&adminLon!=null&&Number(b.latitude)&&Number(b.longitude))?distanceKm(adminLat,adminLon,Number(b.latitude),Number(b.longitude)):null;h+='<div class="distanceRow" onclick="focusBoy(\''+esc(String(b.uid||b.email))+'\')" style="cursor:pointer"><span>🛵 <b>'+esc(shortEmail(b.email))+'</b><br><small>'+ (b.latitude&&b.longitude?'📍 '+Number(b.latitude).toFixed(5)+', '+Number(b.longitude).toFixed(5):'No GPS')+' • '+(age<3&&b.online?'🟢 LIVE':'🟠 '+age+' min ago')+'</small></span><span class="distanceBig">'+(d==null?'—':d.toFixed(2)+' km')+'</span></div>'}el.innerHTML=h;renderDeliveryMarkers();renderDistanceList();var o=document.getElementById('orders');if(o)o.innerHTML=currentOrders.length?mapOrders(currentOrders):'<p class="muted">No orders yet.'}catch(e){adminError('Delivery location display error: '+e.message)}}
function focusBoy(uid){var b=null,i;for(i=0;i<currentDeliveryBoys.length;i++)if(String(currentDeliveryBoys[i].uid||currentDeliveryBoys[i].email)===String(uid)){b=currentDeliveryBoys[i];break}if(!b||!leafletMap)return;leafletMap.setView([Number(b.latitude),Number(b.longitude)],19,{animate:true});var m=leafletMarkers[String(uid)];if(m)m.openPopup()}function renderDistanceList(){var box=document.getElementById('adminDistance');if(!box)return;var h='<b>📍 Admin → Delivery Boy distance</b>';if(adminLat==null||adminLon==null){box.innerHTML=h+'<br><span class="muted">GPS not set.</span><br><button class="btn goldbtn" onclick="startAdminLocation()">📍 MY LOCATION</button>';return}h+='<br><small>Admin: '+adminLat.toFixed(5)+', '+adminLon.toFixed(5)+'</small>';for(var i=0;i<currentDeliveryBoys.length;i++){var b=currentDeliveryBoys[i];if(!b||!Number(b.latitude)||!Number(b.longitude))continue;h+='<div class="distanceRow"><span>🛵 '+esc(shortEmail(b.email))+'</span><span class="distanceBig">'+distanceKm(adminLat,adminLon,Number(b.latitude),Number(b.longitude)).toFixed(2)+' km</span></div>'}box.innerHTML=h}
function shortEmail(e){return String(e||'').split('@')[0]||String(e||'')}
function distanceKm(lat1,lon1,lat2,lon2){var R=6371,rad=Math.PI/180,dLat=(lat2-lat1)*rad,dLon=(lon2-lon1)*rad,a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)*Math.sin(dLon/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function nearestBoy(o){var lat=Number(o.latitude),lon=Number(o.longitude),best=null,i,b,d;if(!lat||!lon)return null;for(i=0;i<currentDeliveryBoys.length;i++){b=currentDeliveryBoys[i];if(!b.email||!Number(b.latitude)||!Number(b.longitude))continue;d=distanceKm(lat,lon,Number(b.latitude),Number(b.longitude));if(!best||d<best.distance)best={email:b.email,distance:d}}return best}
function assignNearest(id){var o=null,i;for(i=0;i<currentOrders.length;i++)if(String(currentOrders[i].id)===String(id)){o=currentOrders[i];break}var n=nearestBoy(o||{});if(!n){adminError('Nearest delivery boy cannot be found: GPS unavailable.');return}var e=document.getElementById('boy_'+id);if(e)e.value=n.email;assignBoy(id)}
function assignBoy(id){var e=document.getElementById('boy_'+id);if(!e||!e.value){adminError('Please select a delivery boy.');return}var v=e.value;e.disabled=true;var b=e.parentElement?e.parentElement.querySelector('.goldbtn'):null;if(b){b.disabled=true;b.textContent='ASSIGNING…'}nativeCall('assign',[id,v])}
function paymentHtml(o){var p=String(o.payment||'COD'),st=String(o.paymentStatus||'');if(p==='COD')return '<div class="paymentBox">💵 <b>COD</b><br><span class="muted">Payment delivery ke time collect hoga.</span></div>';var paid=st==='PAID';return '<div class="paymentBox">📱 <b>UPI / ONLINE PAYMENT</b><br>'+(paid?'<span class="paymentPaid">✅ PAYMENT RECEIVED</span>':'<span class="paymentPending">🟠 PAYMENT PENDING</span><br><a class="btn goldbtn" href="'+actionUrl('payment',o.id,'PAID')+'">💳 Mark Payment Received</a>')+'</div>'}
function actionDone(x){var m=document.getElementById('msg');if(m)m.textContent='✓ '+x}
function statusDone(id,st){var a=document.querySelectorAll('.btn[data-order-id]'),i,b;for(i=0;i<a.length;i++){b=a[i];if(b.getAttribute('data-order-id')===String(id)&&b.getAttribute('data-status')===String(st)){b.classList.add('status-done');b.textContent='✓ '+String(st).replace(/_/g,' ')}}}
function adminError(x){var m=document.getElementById('msg')||document.getElementById('err');if(m)m.textContent='⚠ '+String(x||'Unknown error')}
function nativeError(x){var e=document.getElementById('nativeErr');if(e){e.textContent='⚠ '+String(x||'Unknown error');e.style.display='block';setTimeout(function(){e.style.display='none'},8000)}}
window.nativeCall=nativeCall;window.showLogin=showLogin;window.doLogin=doLogin;window.loginError=loginError;window.showDashboard=showDashboard;window.menuResult=menuResult;window.loadMenu=loadMenu;window.savePrice=savePrice;window.saveAvailability=saveAvailability;window.ordersResult=ordersResult;window.deliveryBoysResult=deliveryBoysResult;window.assignNearest=assignNearest;window.assignBoy=assignBoy;window.startAdminLocation=startAdminLocation;window.adminNativeLocation=adminNativeLocation;window.focusBoy=focusBoy;window.actionDone=actionDone;window.statusDone=statusDone;window.adminError=adminError;window.nativeError=nativeError;loadMenu();if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',showLogin);else showLogin();
})();
</script>
