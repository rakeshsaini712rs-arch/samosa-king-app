<script id="skCaptainTrackingScript">
(function(){

function ctEnsureMap(){if(ctMap&&window.L)return;if(window.L){ctCreateMap();return}var css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(css);var s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=ctCreateMap;s.onerror=function(){var e=document.getElementById('ctMap');if(e)e.innerHTML='<div style="padding:30px;text-align:center">Map unavailable. Please check internet connection.</div>'};document.head.appendChild(s)}
